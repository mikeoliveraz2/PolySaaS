[options]
; ======================
; Database connection
; ======================
; Keep host static for Railway internal network.
db_host = postgres.railway.internal
db_port = 5432
db_user = odoo

; Pin Odoo to the intended Railway Postgres database.
db_name = database1

; Do NOT store db_password in git. Set DB_PASSWORD/PGPASSWORD in Railway vars.

; ======================
; Admin / Security
; ======================
; Use a strong value in production; this file stays in source control.
admin_passwd = admin

; ======================
; Web server
; ======================
proxy_mode = True
http_port = 8069
workers = 0
limit_memory_hard = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
x_frame_options =

; ======================
; Addons
; ======================
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Store filestore on attached Railway volume
; (default Odoo image path, keep explicit for clarity)
data_dir = /var/lib/odoo
