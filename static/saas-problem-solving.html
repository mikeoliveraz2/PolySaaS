<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaaS Problem Solving</title>
  <style>
    :root {
      --bg-1: #0a1024;
      --bg-2: #101a3a;
      --frame: #ffffff;
      --text: #e8ecff;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% 10%, #1b2e6b 0%, transparent 55%),
        radial-gradient(1000px 500px at 90% 90%, #16295c 0%, transparent 50%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    main {
      width: min(1120px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    p {
      margin: 0 0 22px;
      opacity: 0.88;
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
    }

    figure {
      margin: 0;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: 0 22px 55px var(--shadow);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      padding: 12px 16px;
      font-size: 0.92rem;
      color: rgba(232, 236, 255, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.02);
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <img src="/static/img/saas-problem-solving.jpg" alt="Logos of SaaS platforms with text about common customization challenges and PolySaaS dynamic orchestration solution.">
    </figure>
  </main>
</body>
</html>
