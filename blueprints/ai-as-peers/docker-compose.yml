services:
  ai-as-peers:
    build:
      context: .
      dockerfile: Dockerfile
    image: polysaas/ai-as-peers:${TENANT_SLUG}
    restart: unless-stopped
    environment:
      TENANT_SLUG: ${TENANT_SLUG}
      DOMAIN: ${DOMAIN}
      SUBDOMAIN: ${SUBDOMAIN}
      PORT: ${AIASPEERS_PORT:-8000}
      DB_HOST: ${DB_HOST:-aiaspeers-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-aiaspeers}
      DB_USER: ${DB_USER:-aiaspeers}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-aiaspeers-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_ISSUER_URL: ${OAUTH2_ISSUER_URL}
    depends_on:
      aiaspeers-db:
        condition: service_healthy
      aiaspeers-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${AIASPEERS_PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - ${TRAEFIK_NETWORK:-proxy}
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.http.routers.ai-as-peers-${TENANT_SLUG}.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.ai-as-peers-${TENANT_SLUG}.entrypoints=websecure
      - traefik.http.routers.ai-as-peers-${TENANT_SLUG}.tls=true
      - traefik.http.services.ai-as-peers-${TENANT_SLUG}.loadbalancer.server.port=${AIASPEERS_PORT:-8000}

  aiaspeers-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aiaspeers}
      POSTGRES_USER: ${DB_USER:-aiaspeers}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - aiaspeers_db_${TENANT_SLUG}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiaspeers}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  aiaspeers-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  aiaspeers_db_${TENANT_SLUG}:
