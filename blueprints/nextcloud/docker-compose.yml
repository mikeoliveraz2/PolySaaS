services:
  nextcloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: polysaas/nextcloud:${TENANT_SLUG}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${DB_HOST:-nextcloud-db}
      POSTGRES_DB: ${DB_NAME:-nextcloud}
      POSTGRES_USER: ${DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-nextcloud-redis}
      TENANT_SLUG: ${TENANT_SLUG}
      DOMAIN: ${DOMAIN}
      SUBDOMAIN: ${SUBDOMAIN}
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    volumes:
      - nextcloud_html_${TENANT_SLUG}:/var/www/html
      - nextcloud_data_${TENANT_SLUG}:/var/www/html/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - ${TRAEFIK_NETWORK:-proxy}
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.http.routers.nextcloud-${TENANT_SLUG}.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.nextcloud-${TENANT_SLUG}.entrypoints=websecure
      - traefik.http.routers.nextcloud-${TENANT_SLUG}.tls=true
      - traefik.http.services.nextcloud-${TENANT_SLUG}.loadbalancer.server.port=${NEXTCLOUD_PORT:-80}

  nextcloud-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nextcloud}
      POSTGRES_USER: ${DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nextcloud_db_${TENANT_SLUG}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  nextcloud-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:8}
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change_me}
      TENANT_SLUG: ${TENANT_SLUG}
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  nextcloud_html_${TENANT_SLUG}:
  nextcloud_data_${TENANT_SLUG}:
  nextcloud_db_${TENANT_SLUG}:
