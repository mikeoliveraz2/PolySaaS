services:
  dolibarr:
    build:
      context: .
      dockerfile: Dockerfile
    image: polysaas/dolibarr:${TENANT_SLUG}
    restart: unless-stopped
    environment:
      DOLI_DB_HOST: ${DB_HOST:-dolibarr-db}
      DOLI_DB_NAME: ${DB_NAME:-dolibarr}
      DOLI_DB_USER: ${DB_USER:-dolibarr}
      DOLI_DB_PASSWORD: ${DB_PASSWORD}
      TENANT_SLUG: ${TENANT_SLUG}
      DOMAIN: ${DOMAIN}
      SUBDOMAIN: ${SUBDOMAIN}
    depends_on:
      dolibarr-db:
        condition: service_healthy
    volumes:
      - dolibarr_html_${TENANT_SLUG}:/var/www/html
      - dolibarr_docs_${TENANT_SLUG}:/var/www/documents
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${DOLIBARR_PORT:-80}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - ${TRAEFIK_NETWORK:-proxy}
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.http.routers.dolibarr-${TENANT_SLUG}.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.dolibarr-${TENANT_SLUG}.entrypoints=websecure
      - traefik.http.routers.dolibarr-${TENANT_SLUG}.tls=true
      - traefik.http.services.dolibarr-${TENANT_SLUG}.loadbalancer.server.port=${DOLIBARR_PORT:-80}

  dolibarr-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dolibarr}
      MARIADB_USER: ${DB_USER:-dolibarr}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dolibarr_db_${TENANT_SLUG}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  dolibarr_html_${TENANT_SLUG}:
  dolibarr_docs_${TENANT_SLUG}:
  dolibarr_db_${TENANT_SLUG}:
