{% extends "admin/change_form.html" %}
{% load static %}

{% block submit_buttons_bottom %}
{{ block.super }}
{% if add %}
<div class="submit-row" style="margin-top: 10px;">
    <p class="help" style="width: 100%; margin: 0; padding: 10px 12px; background: #f0f4f8; border-radius: 4px; color: #334155;">
        Save this endpoint first — then <strong>PolySniffer 2.0</strong> and auto-login tools appear here.
    </p>
</div>
{% elif original and original.endpoint_url %}
<div class="submit-row" style="margin-top: 10px;">
    <a href="{{ polysniffer_url }}"
       target="_blank"
       rel="noopener"
       class="button"
       style="background: #417ccc; color: white; padding: 10px 15px; width: 100%; text-align: center; border-radius: 4px; font-weight: bold; border: none; cursor: pointer; box-sizing: border-box; display: inline-block; text-decoration: none;">
        🔍 PolySniffer 2.0
    </a>
</div>
<div class="submit-row" style="margin-top: 10px;">
    <button type="button"
            onclick="applyLatestCapture({{ original.id }})"
            class="button"
            style="background: #4caf50; color: white; padding: 10px 15px; width: 100%; text-align: center; border-radius: 4px; font-weight: bold; border: none; cursor: pointer; box-sizing: border-box;">
        ✅ Auto-Login (Playwright)
    </button>
</div>
<div class="submit-row" style="margin-top: 10px;">
    <button type="button"
            onclick="aiGenerateHandler(event, '{{ original.endpoint_url|escapejs }}')"
            class="button"
            style="background: #9c27b0; color: white; padding: 10px 15px; width: 100%; text-align: center; border-radius: 4px; font-weight: bold; border: none; cursor: pointer; box-sizing: border-box;">
        Generate Handler Draft
    </button>
</div>
<script>
function applyLatestCapture(endpointId) {
    console.log('[JS] applyLatestCapture called with endpointId:', endpointId);

    if (!confirm('Use Playwright to auto-login and get fresh session cookie?\n\nThis will:\n1. Log in headlessly using Auth Username/Password\n2. Capture fresh OSTSESSID cookie\n3. Apply it to fix "Access Denied" errors\n\nMake sure Auth Username and Auth Password are set in the form above.')) {
        console.log('[JS] User cancelled');
        return;
    }

    const url = `/admin/polysniffer/apply-capture/${endpointId}/`;
    console.log('[JS] Calling URL:', url);

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        }
    })
    .then(response => {
        console.log('[JS] Response status:', response.status);
        return response.json();
    })
    .then(result => {
        console.log('[JS] Result:', result);
        if (result.success) {
            alert(`✅ Success! Fresh session cookie applied.\n\nRefresh the OS Ticket widget to see the dashboard.`);
            location.reload();
        } else {
            alert('Error: ' + result.error);
        }
    })
    .catch(error => {
        console.error('[JS] Fetch error:', error);
        alert('Error: ' + error.message);
    });
}

function aiGenerateHandler(buttonEvent, endpointUrl) {
    const endpointHost = new URL(endpointUrl).host;

    const captureSessionId = window.prompt('Completed Native capture session ID:');
    if (!captureSessionId || !/^\d+$/.test(captureSessionId)) {
        return;
    }

    const url = `/admin/polysniffer/ai-generate-handler/${endpointHost}/`;
    console.log('[JS] Calling URL:', url);

    const button = buttonEvent.currentTarget;
    const originalText = button.textContent;
    button.textContent = 'Generating draft...';
    button.disabled = true;
    const draftWindow = window.open('', '_blank', 'noopener');

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({capture_session_id: Number(captureSessionId)})
    })
    .then(response => {
        console.log('[JS] Response status:', response.status);
        return response.json();
    })
    .then(result => {
        console.log('[JS] Result:', result);
        button.disabled = false;
        button.textContent = originalText;

        if (result.success) {
            const summary = result.analysis_summary || {};
            if (draftWindow) {
                draftWindow.document.title = `Handler draft — session ${result.capture_session_id}`;
                const heading = draftWindow.document.createElement('h1');
                heading.textContent = `Handler draft — session ${result.capture_session_id}`;
                const metadata = draftWindow.document.createElement('p');
                metadata.textContent = `${result.tenant_schema} · ${result.endpoint_url} · ${summary.auth_method || 'auth not detected'}`;
                const code = draftWindow.document.createElement('pre');
                code.textContent = result.handler_code;
                draftWindow.document.body.replaceChildren(heading, metadata, code);
            }
            alert('Handler draft generated for review. Nothing was installed or saved.');
        } else {
            if (draftWindow) draftWindow.close();
            alert('Error: ' + (result.error || 'Unknown error'));
        }
    })
    .catch(error => {
        console.error('[JS] Fetch error:', error);
        button.disabled = false;
        button.textContent = originalText;
        if (draftWindow) draftWindow.close();
        alert('Error: ' + error.message);
    });
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endif %}
{% endblock %}
