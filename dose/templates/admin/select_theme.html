{% extends "admin/base_site.html" %}
{% block content %}
  <h2>Admin Theme Settings</h2>
  <script>
    if (window.location.search.includes('saved=1')) {
      const params = new URLSearchParams(window.location.search);
      const light = params.get('light');
      const dark = params.get('dark');
      alert(`Theme saved!\nLight: ${light}\nDark: ${dark}`);
    }
  </script>
  <form method="post" action="/admin/select-theme/" id="theme-selector-form">{% csrf_token %}
    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
      <div>
        <label for="light_theme" style="display: block; font-weight: 600; margin-bottom: 5px;">Light theme</label>
        <select name="light_theme" id="light_theme" style="padding: 8px; min-width: 150px;">
          {% for t in light_themes %}
            <option value="{{ t }}" {% if t == light_theme %}selected{% endif %}>{{ t|title }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="text-align: center; position: relative; z-index: 100;">
        <button type="button" id="theme-toggle-btn" onclick="console.log('Button clicked!'); toggleLightDark();" style="
          padding: 10px 20px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          border: none;
          border-radius: 25px;
          cursor: pointer !important;
          font-weight: 600;
          font-size: 14px;
          box-shadow: 0 2px 5px rgba(0,0,0,0.2);
          transition: transform 0.2s, box-shadow 0.2s;
          pointer-events: auto !important;
          opacity: 1 !important;
          position: relative;
          z-index: 101;
        " onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 4px 10px rgba(0,0,0,0.3)'" 
        onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 2px 5px rgba(0,0,0,0.2)'">
          <i class="fas fa-adjust"></i> {% if display_mode == 'dark' %}Change to Light Mode{% else %}Change to Dark Mode{% endif %}
        </button>
        <div style="font-size: 11px; color: #666; margin-top: 5px;">Currently: <strong>{{ display_mode|title }}</strong> mode</div>
      </div>

      <div>
        <label for="dark_theme" style="display: block; font-weight: 600; margin-bottom: 5px;">Dark theme</label>
        <select name="dark_theme" id="dark_theme" style="padding: 8px; min-width: 150px;">
          {% for t in dark_themes %}
            <option value="{{ t }}" {% if t == dark_theme %}selected{% endif %}>{{ t|title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="margin: 1em 0;">
      <label for="use_system_pref_toggle" style="margin-right: 1em;">Use system dark mode preference</label>
      <input type="checkbox" id="use_system_pref_toggle" name="use_system_pref" {% if use_system_pref %}checked{% endif %} style="display:none;">
      <button type="button" id="toggleBtn" onclick="toggleSystemPref()" style="padding: 0.5em 1.5em; border-radius: 2em; border: none; background: {% if use_system_pref %}#007bff{% else %}#ccc{% endif %}; color: white; font-weight: bold; cursor: pointer;">
        <span id="toggleBtnText">{% if use_system_pref %}On{% else %}Off{% endif %}</span>
      </button>
    </div>
    <script>
      function toggleLightDark() {
        console.log('[TOGGLE] Button clicked, calling /dose/toggle-theme/');
        var csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 'missing';
        console.log('[TOGGLE] CSRF token:', csrf.substring(0, 10) + '...');
        fetch('/dose/toggle-theme/', {
          method: 'GET',
          headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': csrf
          }
        })
        .then(response => {
          console.log('[TOGGLE] Response status:', response.status);
          return response.json();
        })
        .then(data => {
          console.log('[TOGGLE] Success, new theme:', data.theme, 'mode:', data.mode);
          window.location.reload();
        })
        .catch(err => {
          console.error('[TOGGLE] Failed:', err);
          alert('Failed to toggle theme: ' + err.message);
        });
      }

      function toggleSystemPref() {
        var cb = document.getElementById('use_system_pref_toggle');
        var btn = document.getElementById('toggleBtn');
        var txt = document.getElementById('toggleBtnText');
        cb.checked = !cb.checked;
        if (cb.checked) {
          btn.style.background = '#007bff';
          txt.textContent = 'On';
        } else {
          btn.style.background = '#ccc';
          txt.textContent = 'Off';
        }
      }
    </script>
    <br><br>
    <input type="submit" value="Save" style="font-size:1.2em;padding:8px 24px;background:#007bff;color:#fff;border:none;border-radius:4px;">
    {% if request.GET.saved %}
      <div style="color:green;margin-top:10px;">Theme saved! Light: {{ request.GET.light }} Dark: {{ request.GET.dark }}</div>
    {% endif %}
  </form>
{% endblock %}
