{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}Mattermost - {{ block.super }}{% endblock %}

{% block content %}
<div style="height: calc(100vh - 150px); width: 100%; display: flex; flex-direction: column; padding: 0; margin: 0;">
  <iframe 
    src="{{ mattermost_iframe_url }}" 
    style="flex: 1; width: 100%; border: none; background: #fff;" 
    allowfullscreen
    allow="camera; microphone">
  </iframe>
</div>

<style>
  #content { padding: 0 !important; }
  .content { padding: 0 !important; }
  body { overflow: hidden; }
</style>
{% endblock %}
