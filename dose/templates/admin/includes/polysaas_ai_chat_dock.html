<!-- BINGO: PolySaaS AI Context-Aware Chat — commit fd9febb8 -->
{# Staff PolySaaS AI chat: defaults inline in admin content; "Pop out" → fixed floating panel. Layout/mode in sessionStorage; chat resets each page. #}
{% load i18n static %}
<style>
    #pssAdminAiChatDock {
        font-family: inherit;
        font-size: 0.875rem;
    }
    /* FIX 2026-08-31 (owner-approved): inline Geronimo spans the content column with a top divider. */
    #pssAdminAiChatDock.pss-ai-inline {
        position: relative;
        width: 100%;
        max-width: none;
        margin: 0;
        box-sizing: border-box;
        z-index: 1;
    }
    #pssAdminAiChatDock.pss-ai-inline::before {
        content: "";
        display: block;
        width: 100%;
        height: 4px;
        margin: 0;
        background: linear-gradient(180deg, #e8eaee 0%, #8c929a 42%, #f3f5f7 58%, #6a6f77 100%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55), 0 2px 4px rgba(15, 23, 42, 0.18);
    }
    #pssAdminAiChatDock.pss-ai-inline #pssAdminAiChatDockPanel {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
        overflow: hidden;
    }
    #pssAdminAiChatDock.pss-ai-floating {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10050;
        width: min(380px, calc(100vw - 32px));
    }
    #pssAdminAiChatDockPanel {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-height: min(68vh, 620px);
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        color: var(--bs-body-color, #212529);
        border: 2px solid #3b82f6;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2), 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        position: relative;
    }
    /* Geronimo AI watermark — 30-degree diagonal, simple text overlay */
    .pss-ai-watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 3rem;
        font-weight: 900;
        color: rgba(59, 130, 246, 0.25);
        transform: translate(-50%, -50%) rotate(-30deg);
        pointer-events: none;
        z-index: 0;
        white-space: nowrap;
        letter-spacing: 3px;
    }
    #pssAdminAiChatDockPanel > :not(.pss-ai-watermark) {
        position: relative;
        z-index: 1;
    }
    #pssAdminAiChatDock.pss-ai-floating #pssAdminAiChatDockPanel {
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.22);
        max-height: min(72vh, 640px);
    }
    #pssAdminAiChatDockHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        flex-wrap: wrap;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        border-bottom: 1px solid rgba(37, 99, 235, 0.3);
        font-weight: 700;
        color: #fff;
    }
    html[data-ps-theme="darkly"] #pssAdminAiChatDockHeader,
    html[data-ps-theme="cyborg"] #pssAdminAiChatDockHeader,
    html[data-ps-theme="slate"] #pssAdminAiChatDockHeader,
    html[data-ps-theme="solar"] #pssAdminAiChatDockHeader,
    html[data-ps-theme="superhero"] #pssAdminAiChatDockHeader {
        background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
        border-bottom-color: rgba(148, 163, 184, 0.25);
    }
    #pssAdminAiChatDockLog {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 10px 12px;
        font-size: 0.8125rem;
        background: var(--bs-body-bg, #fff);
    }
    #pssAdminAiChatDock.pss-ai-inline #pssAdminAiChatDockLog {
        min-height: 200px;
        max-height: 40vh;
    }
    #pssAdminAiChatDock.pss-ai-floating #pssAdminAiChatDockLog {
        min-height: 160px;
        max-height: 38vh;
    }
    #pssAdminAiChatDock .llm-chat-role-user { color: #1a5276; }
    #pssAdminAiChatDock .llm-chat-role-assistant { color: #145a32; }
    #pssAdminAiChatDock .llm-chat-role-error { color: #922b21; }
    #pssAdminAiChatDockFooter {
        padding: 10px 12px 12px;
        border-top: 1px solid rgba(0, 0, 0, 0.06);
    }
    #pssAdminAiChatDockMode { font-size: 0.75rem; margin-bottom: 8px; }
    #pssAdminAiChatDockInput {
        width: 100%;
        min-height: 64px;
        resize: vertical;
        font-size: 0.8125rem;
    }
    #pssAdminAiChatDockMeta { font-size: 0.7rem; color: #64748b; margin-top: 6px; min-height: 1em; }
</style>
<div id="pssAdminAiChatDock" class="admin-llm-router-chat-dock" aria-label="PolySaaS AI chat"
    {% if request.tenant %}data-tenant-name="{{ request.tenant.name|escapejs }}" data-tenant-slug="{{ request.tenant.slug|escapejs }}"{% endif %}>
    <div id="pssAdminAiChatDockPanel" role="region" aria-label="PolySaaS AI">
        <div id="pssAdminAiChatDockHeader">
            <span style="font-size: 0.95rem; color: #fff;">
                <i class="fas fa-wand-magic-sparkles" aria-hidden="true" style="margin-right: 6px;"></i>
                <strong>Geronimo</strong>
            </span>
            <span class="d-flex flex-wrap align-items-center" style="gap:4px;">
                <button type="button" class="btn btn-sm py-0" id="pssAdminAiChatDockToPageBtn" style="font-size:0.65rem; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); display: none;" title="Dock to page">
                    <i class="fas fa-compress-alt" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-sm py-0" id="pssAdminAiChatPopoutBtn" style="font-size:0.65rem; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4);" title="Undock">
                    <i class="fas fa-arrow-expand" aria-hidden="true"></i>
                </button>
            </span>
        </div>
        <div id="pssAdminAiChatDockLog"></div>
        <div id="pssAdminAiChatDockFooter">
            <div id="pssAdminAiChatDockMode" class="text-muted">
                <span class="me-2">Mode:</span>
                <label class="me-2 mb-0"><input type="radio" name="pssDockAiMode" value="standard" checked> Standard</label>
                <label class="mb-0"><input type="radio" name="pssDockAiMode" value="ml_studio"> ML Studio</label>
            </div>
            <textarea id="pssAdminAiChatDockInput" class="form-control form-control-sm" rows="2" placeholder="Message… (Enter to send, Shift+Enter for newline)" autocomplete="off" style="border: 1px solid #3b82f6;"></textarea>
            <div class="d-flex justify-content-between align-items-center mt-2" style="gap:8px;">
                <button type="button" class="btn btn-sm" id="pssAdminAiChatDockSend" style="background: #3b82f6; color: #fff; border: none; font-weight: 600;"><i class="fas fa-paper-plane" aria-hidden="true"></i> Send</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="pssAdminAiChatDockClear" style="font-size: 0.8rem;">Clear</button>
            </div>
            <p id="pssAdminAiChatDockMeta" class="mb-0"></p>
        </div>
    </div>
</div>
<script src="{% static 'admin/js/polysaas_ai_page_context.js' %}?v=20260903-watermark-v4"></script>
<script>
(function () {
    var SK_HISTORY_LEGACY = 'pss_admin_llm_v1_history';
    var SK_META_LEGACY = 'pss_admin_llm_v1_meta';
    var SK_MODE = 'pss_admin_llm_v1_mode';
    var SK_LAYOUT = 'pss_admin_llm_v1_layout';
    var SK_DOCK_OPEN_LEGACY = 'pss_admin_llm_v1_dock_open';

    var dock = document.getElementById('pssAdminAiChatDock');
    if (!dock) return;

    var adminApiUrl = '{% url "admin_llm_router_chat_api" %}';
    var tenantApiUrl = '{% url "tenant_llm_router_chat_api" %}';
    var apiUrl = adminApiUrl;

    // In passthrough/embed flows (Mattermost, Odoo, etc.), use tenant API.
    // The admin API is staff-only and can 403 in embedded runtime contexts.
    try {
        var p = String(window.location.pathname || '');
        var q = String(window.location.search || '');
        if (p.indexOf('/pt/admin/') === 0 || q.indexOf('_raw=1') !== -1) {
            apiUrl = tenantApiUrl;
        }
    } catch (e) {
        apiUrl = tenantApiUrl;
    }
    var logEl = document.getElementById('pssAdminAiChatDockLog');
    var input = document.getElementById('pssAdminAiChatDockInput');
    var sendBtn = document.getElementById('pssAdminAiChatDockSend');
    var clearBtn = document.getElementById('pssAdminAiChatDockClear');
    var meta = document.getElementById('pssAdminAiChatDockMeta');
    var popBtn = document.getElementById('pssAdminAiChatPopoutBtn');
    var dockToPageBtn = document.getElementById('pssAdminAiChatDockToPageBtn');
    var history = [];

    function contentColumn() {
        return document.querySelector('.dose-content-col');
    }

    function getLayout() {
        try {
            var v = sessionStorage.getItem(SK_LAYOUT);
            if (v === 'floating' || v === 'inline') return v;
            if (sessionStorage.getItem(SK_DOCK_OPEN_LEGACY) === '1') return 'floating';
        } catch (e) {}
        // Endpoint homes: default to floating (branded panel is separate tool)
        // Other pages: default to inline (integrated into content)
        var isEndpointHome = document.querySelector('[data-endpoint-home]') !== null;
        return isEndpointHome ? 'floating' : 'inline';
    }

    function persistLayout(mode) {
        try {
            sessionStorage.setItem(SK_LAYOUT, mode);
            sessionStorage.removeItem(SK_DOCK_OPEN_LEGACY);
        } catch (e) {}
    }

    function applyLayout(mode) {
        dock.classList.remove('pss-ai-inline', 'pss-ai-floating');
        var col = contentColumn();
        if (mode === 'floating') {
            dock.classList.add('pss-ai-floating');
            document.body.appendChild(dock);
            if (popBtn) popBtn.style.display = 'none';
            if (dockToPageBtn) dockToPageBtn.style.display = '';
        } else {
            dock.classList.add('pss-ai-inline');
            if (col) {
                col.appendChild(dock);
            } else {
                document.body.appendChild(dock);
                dock.classList.remove('pss-ai-inline');
                dock.classList.add('pss-ai-floating');
                mode = 'floating';
                if (popBtn) popBtn.style.display = 'none';
                if (dockToPageBtn) dockToPageBtn.style.display = '';
                persistLayout('floating');
                return;
            }
            if (popBtn) popBtn.style.display = '';
            if (dockToPageBtn) dockToPageBtn.style.display = 'none';
        }
    }

    function setLayout(mode) {
        persistLayout(mode);
        applyLayout(mode);
    }

    function mountInitialLayout() {
        var mode = getLayout();
        applyLayout(mode);
    }

    function getCookie(name) {
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    function getCsrf() {
        var el = document.querySelector('[name=csrfmiddlewaretoken]');
        if (el && el.value) return el.value;
        return getCookie('csrftoken');
    }
    function selectedMode() {
        var el = document.querySelector('input[name="pssDockAiMode"]:checked');
        return el ? el.value : 'standard';
    }
    function persistMode() {
        try {
            sessionStorage.setItem(SK_MODE, selectedMode());
        } catch (e) {}
    }
    function loadModeRadios() {
        try {
            var m = sessionStorage.getItem(SK_MODE);
            if (m === 'ml_studio') {
                var r = document.querySelector('input[name="pssDockAiMode"][value="ml_studio"]');
                if (r) r.checked = true;
            }
        } catch (e) {}
    }
    function purgeLegacyChatStorage() {
        try {
            sessionStorage.removeItem(SK_HISTORY_LEGACY);
            sessionStorage.removeItem(SK_META_LEGACY);
        } catch (e) {}
    }
    function appendLine(role, text) {
        var wrap = document.createElement('div');
        wrap.className = 'mb-2 text-break';
        var strong = document.createElement('div');
        strong.className = 'font-weight-bold llm-chat-role-' + role;
        strong.textContent = role === 'user' ? 'You' : (role === 'error' ? 'Error' : 'Assistant');
        var body = document.createElement('div');
        body.textContent = text;
        wrap.appendChild(strong);
        wrap.appendChild(body);
        logEl.appendChild(wrap);
        logEl.scrollTop = logEl.scrollHeight;
    }
    function setMeta(text) {
        if (meta) meta.textContent = text || '';
    }
    function clearChat() {
        history = [];
        if (logEl) logEl.innerHTML = '';
        setMeta('');
        purgeLegacyChatStorage();
        showGreeting();
    }
    function pageContextForSend() {
        if (window.PolySaaSAiPageContext && typeof window.PolySaaSAiPageContext.collect === 'function') {
            return window.PolySaaSAiPageContext.collect(dock);
        }
        try {
            var path = window.location.pathname + window.location.search;
            return path.trim().slice(0, 500);
        } catch (e) {
            return '';
        }
    }

    function detectFormName() {
        // Try breadcrumb text first (Django admin renders model name there)
        var crumbs = document.querySelectorAll('.breadcrumbs a, #breadcrumbs a, .breadcrumb-item a, .breadcrumb a');
        if (crumbs.length >= 2) {
            var last = crumbs[crumbs.length - 1].textContent.trim();
            if (last && last.length > 1) return last;
        }
        // Fallback: parse from admin URL  /admin/dose/callbackdata/add/ -> "Call Back Data"
        var m = window.location.pathname.match(/\/admin\/\w+\/(\w+)\//);
        if (m) {
            return m[1].replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
        }
        // Generic fallback
        return 'this page';
    }

    function showGreeting() {
        if (history.length > 0) return;
        var username = '{{ user.get_short_name|default:user.username|escapejs }}';
        var formName = detectFormName();
        var greeting = 'Hi ' + (username || 'there') + " — I'm **Geronimo**, your context-aware PolySaaS co-pilot. "
            + 'I can see where you are on this page. How can I help with ' + formName + '?';
        appendLine('assistant', greeting);
    }

    function initChatUi() {
        history = [];
        if (logEl) logEl.innerHTML = '';
        purgeLegacyChatStorage();
        showGreeting();
        loadModeRadios();
    }

    initChatUi();

    function onReady() {
        mountInitialLayout();
        window.setTimeout(function () {
            if (getLayout() === 'inline' && dock.parentNode !== contentColumn() && contentColumn()) {
                mountInitialLayout();
            }
        }, 120);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', onReady);
    } else {
        onReady();
    }

    window.addEventListener('pageshow', function () {
        if (getLayout() === 'inline' && contentColumn() && dock.parentNode !== contentColumn()) {
            mountInitialLayout();
        }
    });

    document.querySelectorAll('input[name="pssDockAiMode"]').forEach(function (r) {
        r.addEventListener('change', persistMode);
    });

    if (popBtn) {
        popBtn.addEventListener('click', function () {
            setLayout('floating');
        });
    }
    if (dockToPageBtn) {
        dockToPageBtn.addEventListener('click', function () {
            setLayout('inline');
        });
    }

    if (sendBtn) {
        sendBtn.addEventListener('click', function () {
            var text = (input && input.value || '').trim();
            if (!text) return;
            sendBtn.disabled = true;
            appendLine('user', text);
            if (input) input.value = '';
            setMeta('Sending…');
            var pageContext = pageContextForSend();
            fetch(apiUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrf()
                },
                body: JSON.stringify({
                    message: text,
                    history: history,
                    mode: selectedMode(),
                    page_context: pageContext
                })
            }).then(function (r) {
                return r.json().then(function (data) {
                    if (!r.ok) {
                        throw new Error(data.detail || data.error || ('HTTP ' + r.status));
                    }
                    return data;
                });
            }).then(function (data) {
                var reply = data.reply || '';
                appendLine('assistant', reply);
                history.push({ role: 'user', content: text });
                history.push({ role: 'assistant', content: reply });
                var tail = (data.provider || '') + ' / ' + (data.model || '') +
                    (data.task_bucket ? (' · ' + data.task_bucket) : '');
                if (data.meta && data.meta.ml_studio) {
                    try {
                        tail += ' · ML ' + JSON.stringify(data.meta.ml_studio);
                    } catch (e) {
                        tail += ' · ML (meta)';
                    }
                }
                setMeta(tail.trim());
            }).catch(function (err) {
                appendLine('error', err.message || String(err));
                setMeta('');
            }).finally(function () {
                sendBtn.disabled = false;
            });
        });
    }

    if (clearBtn) {
        clearBtn.addEventListener('click', clearChat);
    }

    if (input) {
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (sendBtn) sendBtn.click();
            }
        });
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && dock.classList.contains('pss-ai-floating')) {
            setLayout('inline');
        }
    });

    // Add watermark via JS to ensure it always renders
    window.setTimeout(function () {
        var panel = document.getElementById('pssAdminAiChatDockPanel');
        if (panel && !document.querySelector('.pss-ai-watermark')) {
            var watermark = document.createElement('div');
            watermark.className = 'pss-ai-watermark';
            watermark.textContent = 'Geronimo AI';
            watermark.style.cssText = 'position:absolute;top:50%;left:50%;font-size:3rem;font-weight:900;color:rgba(59,130,246,0.5);text-shadow:0 0 4px rgba(59,130,246,0.4);transform:translate(-50%,-50%) rotate(-30deg);pointer-events:none;z-index:0;white-space:nowrap;letter-spacing:3px;';
            panel.insertBefore(watermark, panel.firstChild);
        }
    }, 100);
})();
</script>
