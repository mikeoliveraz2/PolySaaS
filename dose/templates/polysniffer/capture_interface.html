<!DOCTYPE html>
<html>
<head>
    <title>PolySniffer Capture - {{ endpoint.menu_title|default:endpoint.trigger_path }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Green Bar */
        .green-bar {
            height: 44px;
            background: linear-gradient(90deg, #000000, #0a0a0a);
            color: #00ff00;
            font: bold 14px 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 3px solid #00ff00;
            box-shadow: 0 4px 20px rgba(0,255,0,0.6);
            flex-shrink: 0;
            z-index: 999999;
        }

        .green-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .green-bar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .green-bar button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 6px 12px;
            font: bold 12px 'Courier New', monospace;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .green-bar button:hover {
            background: #0a0;
            transform: scale(1.05);
        }

        .green-bar button.danger {
            background: #f00;
            color: #fff;
        }

        .green-bar button.danger:hover {
            background: #a00;
        }

        #ps-count {
            color: #0f0;
            font-weight: bold;
            font-size: 16px;
        }

        /* Capture Log */
        #capture-log {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 11px;
            background: #0a0a0a;
        }

        .log-entry {
            padding: 8px;
            margin-bottom: 4px;
            border-left: 3px solid #0f0;
            background: rgba(0,255,0,0.05);
            transition: all 0.2s;
        }

        .log-entry:hover {
            background: rgba(0,255,0,0.1);
            border-left-width: 5px;
        }

        .log-entry.GET { border-left-color: #4caf50; }
        .log-entry.POST { border-left-color: #2196f3; }
        .log-entry.PUT { border-left-color: #ff9800; }
        .log-entry.DELETE { border-left-color: #f44336; }

        .log-method {
            font-weight: bold;
            color: #0f0;
            margin-right: 8px;
        }

        .log-url {
            color: #0f0;
            word-break: break-all;
        }

        .log-time {
            color: #666;
            font-size: 10px;
            margin-top: 4px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #0f0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #0a0;
        }
    </style>
</head>
<body>
    <!-- Green Bar -->
    <div class="green-bar">
        <div class="green-bar-left">
            <span>🟢 PolySniffer ACTIVE — Capturing all traffic — <span id="ps-count">0</span> requests</span>
        </div>
        <div class="green-bar-right">
            <button onclick="stopCapture()">⏹ Stop</button>
            <button onclick="clearLog()">🗑 Clear</button>
            <button onclick="generateHandler()">🤖 Generate Handler</button>
            <button onclick="deployHandler()">🚀 Deploy</button>
        </div>
    </div>

    <!-- Capture Log -->
    <div id="capture-log">
        <div class="log-entry">
            <div><span class="log-method">[SYSTEM]</span> <span class="log-url">PolySniffer capture interface initialized. Waiting for traffic from navigation tab...</span></div>
            <div class="log-time">{{ "now"|date:"H:i:s" }}</div>
        </div>
    </div>

    <script>
        const endpointId = {{ endpoint_id }};
        let requestCount = 0;
        let isCapturing = true;
        const captureLog = document.getElementById('capture-log');
        const countElement = document.getElementById('ps-count');

        // Poll for captured requests from the navigation tab
        function pollCaptures() {
            if (!isCapturing) return;

            fetch(`/admin/polysniffer/get-captures/${endpointId}/`, {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                if (data.captures && data.captures.length > 0) {
                    // Add new captures to log
                    data.captures.forEach(capture => {
                        handleCapture(capture);
                    });
                }
            })
            .catch(error => {
                console.error('[CAPTURE INTERFACE] Error polling captures:', error);
            });
        }

        // Poll every 500ms
        setInterval(pollCaptures, 500);

        function handleCapture(payload) {
            requestCount++;
            countElement.textContent = requestCount;

            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${payload.method || 'GET'}`;

            const method = payload.method || 'GET';
            const url = payload.url || 'Unknown';
            const status = payload.status || '?';
            const timestamp = new Date().toLocaleTimeString();

            logEntry.innerHTML = `
                <div>
                    <span class="log-method">[${method}]</span>
                    <span class="log-url">${escapeHtml(url)}</span>
                    <span style="color: ${getStatusColor(status)}; margin-left: 10px;">${status}</span>
                </div>
                <div class="log-time">${timestamp}</div>
            `;

            captureLog.insertBefore(logEntry, captureLog.firstChild);

            // Keep only last 100 entries
            while (captureLog.children.length > 100) {
                captureLog.removeChild(captureLog.lastChild);
            }

            // Auto-scroll to top
            captureLog.scrollTop = 0;
        }

        function getStatusColor(status) {
            if (status >= 200 && status < 300) return '#0f0';
            if (status >= 300 && status < 400) return '#ff0';
            if (status >= 400 && status < 500) return '#ff9800';
            if (status >= 500) return '#f00';
            return '#666';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function stopCapture() {
            isCapturing = !isCapturing;
            const button = event.target;
            if (isCapturing) {
                button.textContent = '⏹ Stop';
                button.style.background = '#0f0';
            } else {
                button.textContent = '▶ Resume';
                button.style.background = '#ff0';
            }
        }

        function clearLog() {
            captureLog.innerHTML = '<div class="log-entry"><div><span class="log-method">[SYSTEM]</span> <span class="log-url">Log cleared</span></div><div class="log-time">' + new Date().toLocaleTimeString() + '</div></div>';
            requestCount = 0;
            countElement.textContent = '0';
        }

        function generateHandler() {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <div><span class="log-method">[SYSTEM]</span> <span class="log-url">Handler generation coming soon...</span></div>
                <div class="log-time">${new Date().toLocaleTimeString()}</div>
            `;
            captureLog.insertBefore(logEntry, captureLog.firstChild);
        }

        function deployHandler() {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <div><span class="log-method">[SYSTEM]</span> <span class="log-url">Handler deployment coming soon...</span></div>
                <div class="log-time">${new Date().toLocaleTimeString()}</div>
            `;
            captureLog.insertBefore(logEntry, captureLog.firstChild);
        }

        // Initialize
        console.log("%c🟢 PolySniffer CAPTURE INTERFACE ACTIVE", "color:#0f0;font-size:20px;font-weight:bold");
        console.log("[CAPTURE INTERFACE] Endpoint ID:", endpointId);
        console.log("[CAPTURE INTERFACE] Polling for captures from navigation tab...");
    </script>
</body>
</html>
