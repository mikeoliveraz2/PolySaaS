{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}PolySniffer - {{ endpoint.menu_title|default:endpoint.trigger_path }}{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Remove default Django admin content padding for full-width external service */
    #content { padding: 0 !important; }
    #content-main { padding: 0 !important; margin: 0 !important; }
    .module { padding: 0 !important; }

    /* CRITICAL: Protect admin sidebar from external service CSS bleeding */
    #jazzy-sidebar,
    .main-sidebar,
    .nav-sidebar {
        background-color: #1f4788 !important;
        color: #c0c0c0 !important;
        z-index: 1000 !important;
    }

    #jazzy-sidebar a,
    #jazzy-sidebar .nav-link,
    .nav-sidebar a,
    .nav-sidebar .nav-link {
        color: #c0c0c0 !important;
    }

    #jazzy-sidebar a:hover,
    #jazzy-sidebar .nav-link:hover,
    .nav-sidebar a:hover,
    .nav-sidebar .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
    }

    /* PolySniffer Toolbar */
    #polysniffer-toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 55px;
        background: #1a1a1a;
        color: #0f0;
        z-index: 99999;
        border-bottom: 3px solid #0f0;
        font-family: system-ui;
        display: flex;
        align-items: center;
        padding: 0 15px;
        gap: 10px;
        box-shadow: 0 4px 20px rgba(0, 255, 0, 0.3);
    }

    #polysniffer-toolbar button {
        cursor: pointer;
        transition: all 0.2s;
    }

    #polysniffer-toolbar button:hover {
        opacity: 0.8;
        transform: scale(1.05);
    }

    /* Content area - full width, remove all admin styling */
    .main-content-wrapper {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        position: relative;
        overflow: visible;
        background: transparent;
        margin-top: 55px; /* Space for toolbar */
    }

    /* Remove any admin wrapper styling that might interfere */
    body {
        overflow-x: hidden;
    }
</style>
{% endblock %}

{% block content %}
<!-- PolySniffer Toolbar -->
<div id="polysniffer-toolbar">
    <button onclick="captureNow()" style="background:#0f0;color:#000;padding:8px 16px;border:none;font-weight:bold;cursor:pointer;">⚡ CAPTURE SESSION</button>
    <button onclick="copyCookies()" style="background:#333;color:#0f0;border:1px solid #0f0;padding:8px 16px;cursor:pointer;">📋 Copy Cookies</button>
    <button onclick="copyPost()" style="background:#333;color:#0f0;border:1px solid #0f0;padding:8px 16px;cursor:pointer;">📤 Copy Last POST</button>
    <button onclick="autoLogin()" style="background:#333;color:#0f0;border:1px solid #0f0;padding:8px 16px;cursor:pointer;">🔑 Auto-Login</button>
    <button onclick="highlightAjax()" style="background:#333;color:#0f0;border:1px solid #0f0;padding:8px 16px;cursor:pointer;">🔍 Highlight AJAX</button>
    <span id="status" style="margin-left:auto;color:#0f0;font-weight:bold;">Ready</span>
</div>

<div class="main-content-wrapper">
    {{ html_content|safe }}
</div>

<script>
// PolySniffer Toolbar Functions
const endpointId = {{ endpoint.id }};
let lastPostData = null;
let ajaxHighlights = [];

function updateStatus(message, color = '#0f0') {
    const statusEl = document.getElementById('status');
    if (statusEl) {
        statusEl.textContent = message;
        statusEl.style.color = color;
        setTimeout(() => {
            statusEl.textContent = 'Ready';
            statusEl.style.color = '#0f0';
        }, 3000);
    }
}

function captureNow() {
    updateStatus('Capturing session...', '#ff0');

    try {
        const cookies = document.cookie;
        const cookieData = {};
        if (cookies) {
            cookies.split(';').forEach(cookie => {
                const [name, value] = cookie.trim().split('=');
                if (name && value) {
                    cookieData[name] = decodeURIComponent(value);
                }
            });
        }

        const captureData = {
            captures: [{
                cookies: cookieData,
                url: window.location.href,
                timestamp: new Date().toISOString(),
                method: 'GET',
                status: 200
            }]
        };

        fetch(`/admin/polysniffer/save-capture/${endpointId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(captureData)
        })
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data.success) {
                updateStatus('✅ Session captured!', '#0f0');
            } else {
                updateStatus('❌ Capture failed: ' + (data.error || 'Unknown'), '#f00');
            }
        })
        .catch(error => {
            console.error('Capture error:', error);
            updateStatus('❌ Capture error: ' + error.message, '#f00');
        });
    } catch (error) {
        console.error('Capture setup error:', error);
        updateStatus('❌ Capture setup error', '#f00');
    }
}

function copyCookies() {
    try {
        const cookies = document.cookie;
        if (!cookies) {
            updateStatus('No cookies found', '#ff0');
            return;
        }

        const cookieData = {};
        cookies.split(';').forEach(cookie => {
            const [name, value] = cookie.trim().split('=');
            if (name && value) {
                cookieData[name] = decodeURIComponent(value);
            }
        });

        const formatted = JSON.stringify(cookieData, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(formatted).then(() => {
                updateStatus('✅ Cookies copied!', '#0f0');
            }).catch(() => {
                alert('Cookies:\n\n' + formatted);
                updateStatus('✅ Cookies shown', '#0f0');
            });
        } else {
            alert('Cookies:\n\n' + formatted);
            updateStatus('✅ Cookies shown', '#0f0');
        }
    } catch (error) {
        console.error('Copy cookies error:', error);
        updateStatus('❌ Copy error', '#f00');
    }
}

function copyPost() {
    try {
        if (!lastPostData) {
            updateStatus('No POST data captured yet', '#ff0');
            return;
        }

        const formatted = JSON.stringify(lastPostData, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(formatted).then(() => {
                updateStatus('✅ POST data copied!', '#0f0');
            }).catch(() => {
                alert('Last POST Data:\n\n' + formatted);
                updateStatus('✅ POST data shown', '#0f0');
            });
        } else {
            alert('Last POST Data:\n\n' + formatted);
            updateStatus('✅ POST data shown', '#0f0');
        }
    } catch (error) {
        console.error('Copy POST error:', error);
        updateStatus('❌ Copy error', '#f00');
    }
}

function autoLogin() {
    updateStatus('Auto-login in progress...', '#ff0');

    fetch(`/admin/polysniffer/apply-capture/${endpointId}/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            updateStatus('✅ Auto-login complete! Refreshing...', '#0f0');
            setTimeout(() => window.location.reload(), 1000);
        } else {
            updateStatus('❌ Auto-login failed: ' + (data.error || 'Unknown error'), '#f00');
        }
    })
    .catch(error => {
        console.error('Auto-login error:', error);
        updateStatus('❌ Auto-login error', '#f00');
    });
}

function highlightAjax() {
    ajaxHighlights.forEach(el => {
        if (el && el.parentNode) el.parentNode.removeChild(el);
    });
    ajaxHighlights = [];

    document.querySelectorAll('form[action]').forEach(form => {
        const action = form.getAttribute('action');
        if (action && (action.includes('ajax') || action.includes('login') || action.includes('api'))) {
            const highlight = document.createElement('div');
            highlight.style.cssText = 'position:absolute;border:3px solid #0f0;background:rgba(0,255,0,0.1);pointer-events:none;z-index:99998;';
            const rect = form.getBoundingClientRect();
            highlight.style.top = (rect.top + window.scrollY) + 'px';
            highlight.style.left = (rect.left + window.scrollX) + 'px';
            highlight.style.width = rect.width + 'px';
            highlight.style.height = rect.height + 'px';
            document.body.appendChild(highlight);
            ajaxHighlights.push(highlight);
        }
    });

    updateStatus('✅ AJAX elements highlighted', '#0f0');
    setTimeout(() => {
        ajaxHighlights.forEach(el => {
            if (el && el.parentNode) el.parentNode.removeChild(el);
        });
        ajaxHighlights = [];
    }, 5000);
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Intercept form submissions
document.addEventListener('submit', function(e) {
    const form = e.target;
    if (form.tagName === 'FORM') {
        const formData = new FormData(form);
        lastPostData = {
            action: form.action || form.getAttribute('action'),
            method: form.method || 'GET',
            data: Object.fromEntries(formData)
        };
        updateStatus('📤 POST captured', '#ff0');
    }
});

// Intercept AJAX calls
(function() {
    if (window.XMLHttpRequest) {
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;

        XMLHttpRequest.prototype.open = function(method, url, ...args) {
            this._method = method;
            this._url = url;
            return originalOpen.apply(this, [method, url, ...args]);
        };

        XMLHttpRequest.prototype.send = function(data) {
            if (this._method === 'POST' && data) {
                try {
                    lastPostData = {
                        method: this._method,
                        url: this._url,
                        data: typeof data === 'string' ? JSON.parse(data) : data
                    };
                    updateStatus('📤 AJAX POST captured', '#ff0');
                } catch (e) {
                    lastPostData = {
                        method: this._method,
                        url: this._url,
                        data: data.toString()
                    };
                }
            }
            return originalSend.apply(this, arguments);
        };
    }
})();
</script>
{% endblock %}
