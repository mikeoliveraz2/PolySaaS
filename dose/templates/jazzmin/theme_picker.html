{% load static %}
<!-- Theme Picker for Jazzmin Admin -->
<div style="padding: 1.5em; background: rgba(255,255,255,0.05); border-radius: 6px; margin: 0.5em 0;">
  <!-- Theme Selector -->
  <div style="margin-bottom: 1.2em;">
    <label for="theme-picker" style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 0.75em; color: #fff;">
      <i class="fas fa-palette"></i> Theme Selector
    </label>
    <select id="theme-picker" name="theme-picker" style="width: 100%; padding: 0.75em; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; cursor: pointer; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px;">
      <option value="default">🎨 Default</option>
      <option value="flatly">🔵 Flatly</option>
      <option value="lumen">☀️ Lumen</option>
      <option value="cyborg">🤖 Cyborg</option>
      <option value="darkly">🌙 Darkly</option>
      <option value="sandstone">🏜️ Sandstone</option>
    </select>
  </div>

  <!-- Font Family Selector -->
  <div style="margin-bottom: 1.2em;">
    <label for="font-family" style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 0.75em; color: #fff;">
      <i class="fas fa-font"></i> Font Family
    </label>
    <select id="font-family" name="font-family" style="width: 100%; padding: 0.75em; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; cursor: pointer; font-size: 14px;">
      <option value="segoe">Segoe UI (Default)</option>
      <option value="arial">Arial</option>
      <option value="georgia">Georgia</option>
      <option value="verdana">Verdana</option>
      <option value="courier">Courier New</option>
      <option value="tahoma">Tahoma</option>
    </select>
  </div>

  <!-- Font Size Slider -->
  <div style="margin-bottom: 1.2em;">
    <label for="font-size" style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 0.75em; color: #fff;">
      <i class="fas fa-text-height"></i> Font Size: <span id="font-size-value" style="margin-left: 0.5em; font-weight: bold;">14px</span>
    </label>
    <input type="range" id="font-size" name="font-size" min="12" max="18" value="14" style="width: 100%; cursor: pointer; height: 6px;">
  </div>

  <!-- Font Weight Slider -->
  <div>
    <label for="font-weight" style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 0.75em; color: #fff;">
      <i class="fas fa-bold"></i> Font Weight: <span id="font-weight-value" style="margin-left: 0.5em; font-weight: bold;">500</span>
    </label>
    <input type="range" id="font-weight" name="font-weight" min="400" max="700" step="100" value="500" style="width: 100%; cursor: pointer; height: 6px;">
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var themePicke = document.getElementById('theme-picker');
    var fontFamily = document.getElementById('font-family');
    var fontSize = document.getElementById('font-size');
    var fontWeight = document.getElementById('font-weight');
    var fontSizeValue = document.getElementById('font-size-value');
    var fontWeightValue = document.getElementById('font-weight-value');

    // Initialize theme picker
    if (themePicke) {
      themePicke.value = "{{ jazzmin_theme|default:'default' }}";
      themePicke.addEventListener('change', function() {
        localStorage.setItem('jazzmin_theme', this.value);
      });
    }

    // Font family change
    if (fontFamily) {
      const fontFamilyMap = {
        'segoe': '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif',
        'arial': 'Arial, sans-serif',
        'georgia': 'Georgia, serif',
        'verdana': 'Verdana, sans-serif',
        'courier': '"Courier New", monospace',
        'tahoma': 'Tahoma, sans-serif'
      };

      fontFamily.addEventListener('change', function() {
        document.body.style.fontFamily = fontFamilyMap[this.value];
        localStorage.setItem('jazzmin_font_family', this.value);
      });

      // Load saved font family
      const savedFont = localStorage.getItem('jazzmin_font_family') || 'segoe';
      fontFamily.value = savedFont;
      document.body.style.fontFamily = fontFamilyMap[savedFont];
    }

    // Font size change
    if (fontSize) {
      fontSize.addEventListener('change', function() {
        document.body.style.fontSize = this.value + 'px';
        fontSizeValue.textContent = this.value + 'px';
        localStorage.setItem('jazzmin_font_size', this.value);
      });

      // Load saved font size
      const savedSize = localStorage.getItem('jazzmin_font_size') || '14';
      fontSize.value = savedSize;
      document.body.style.fontSize = savedSize + 'px';
      fontSizeValue.textContent = savedSize + 'px';
    }

    // Font weight change
    if (fontWeight) {
      fontWeight.addEventListener('change', function() {
        document.body.style.fontWeight = this.value;
        fontWeightValue.textContent = this.value;
        localStorage.setItem('jazzmin_font_weight', this.value);
      });

      // Load saved font weight
      const savedWeight = localStorage.getItem('jazzmin_font_weight') || '500';
      fontWeight.value = savedWeight;
      document.body.style.fontWeight = savedWeight;
      fontWeightValue.textContent = savedWeight;
    }
  });
</script>
<!-- Make sure to include theme-picker.js for AJAX persistence -->
<script src="{% static 'admin/js/theme-picker.js' %}"></script>
