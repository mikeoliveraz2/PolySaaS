{% extends "dose/dosebase.html" %}
{% load static %}

{% block title %}Send Email - Gmail - Dose{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-paper-plane"></i> Compose Email</h3>
                </div>
                <div class="card-body">
                    <form id="send-email-form" data-send-url="{% url 'dose:gmail_send' %}" data-inbox-url="{% url 'dose:gmail_inbox' %}">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="to">To:</label>
                            <input type="email" class="form-control" id="to" name="to" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="subject">Subject:</label>
                            <input type="text" class="form-control" id="subject" name="subject" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="body">Message:</label>
                            <textarea class="form-control" id="body" name="body" rows="10" required></textarea>
                        </div>
                        
                        <div id="send-status" class="alert" style="display: none;"></div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'dose:gmail_inbox' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Back to Inbox
                            </a>
                            <button type="submit" class="btn btn-primary" id="send-btn">
                                <i class="fas fa-paper-plane"></i> Send Email
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'dose/js/gmail_send.js' %}"></script>
{% endblock %}
</script>
{% endblock %}
