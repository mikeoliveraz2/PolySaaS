{% extends "dose/dosebase.html" %}

{% block title %}Gmail Error - Dose{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-danger">
                <h4 class="alert-heading"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i> Gmail Error</h4>
                <p>{{ error }}</p>
                <hr>
                <p class="mb-0">
                    <a href="{% if auth_url %}{{ auth_url }}{% else %}/accounts/google/login/?process=connect{% endif %}" class="btn btn-success me-2">
                        <i class="fab fa-google"></i> Connect Google Account
                    </a>
                    <a href="{% url 'dose:dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
