<!-- 
  Founder Beta Circle Form for WordPress
  Paste this into a WordPress page content or custom HTML block
  Calls: POST /dose/api/founders/signup/ → returns checkout URL
-->

<style>
  .founders-form-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background: #f8f9fa;
    border-radius: 8px;
    font-family: inherit;
  }
  
  .founders-form-container h2 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #333;
  }
  
  .form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1em;
    box-sizing: border-box;
    font-family: inherit;
  }
  
  .form-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }
  
  .form-group small {
    display: block;
    margin-top: 5px;
    color: #666;
    font-size: 0.9em;
  }
  
  .form-group .error {
    color: #dc3545;
    font-size: 0.9em;
    margin-top: 5px;
  }
  
  .submit-btn {
    width: 100%;
    background: #667eea;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 4px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
  }
  
  .submit-btn:hover {
    background: #5568d3;
  }
  
  .submit-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  
  .alert {
    padding: 15px;
    border-radius: 4px;
    margin-bottom: 20px;
  }
  
  .alert-danger {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  
  .alert-success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  
  .loading {
    display: none;
    text-align: center;
    color: #667eea;
    margin: 10px 0;
  }
</style>

<div class="founders-form-container">
  <h2>Founder Beta Circle - Sign Up</h2>
  
  <div id="generalError" class="alert alert-danger" style="display: none;"></div>
  <div id="successMessage" class="alert alert-success" style="display: none;"></div>
  
  <form id="foundersForm">
    <div class="form-group">
      <label for="companyName">Company Name *</label>
      <input 
        type="text" 
        id="companyName" 
        name="company_name" 
        placeholder="e.g., Acme Corp"
        required
      >
      <div id="errorCompanyName" class="error"></div>
    </div>

    <div class="form-group">
      <label for="companySlug">Tenant URL Slug *</label>
      <input 
        type="text" 
        id="companySlug" 
        name="company_slug" 
        placeholder="e.g., acme-corp (alphanumeric, hyphens OK)"
        pattern="[a-zA-Z0-9\-_]+"
        required
      >
      <small>Your tenant will be: <strong>polysaas.online/<span id="slugPreview">your-slug</span></strong></small>
      <div id="errorCompanySlug" class="error"></div>
    </div>

    <div class="form-group">
      <label for="adminUsername">Admin Username *</label>
      <input 
        type="text" 
        id="adminUsername" 
        name="admin_username" 
        placeholder="e.g., john.smith"
        minlength="3"
        required
      >
      <div id="errorAdminUsername" class="error"></div>
    </div>

    <div class="form-group">
      <label for="adminEmail">Admin Email *</label>
      <input 
        type="email" 
        id="adminEmail" 
        name="admin_email" 
        placeholder="e.g., john@acme.com"
        required
      >
      <div id="errorAdminEmail" class="error"></div>
    </div>

    <div class="loading" id="loading">
      <p>Processing... redirecting to payment...</p>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      Proceed to Payment → $100
    </button>
  </form>
  
  <p style="text-align: center; margin-top: 20px; color: #666; font-size: 0.9em;">
    Payment processed securely via Lemon Squeezy. No additional charges.
  </p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('foundersForm');
  const slugInput = document.getElementById('companySlug');
  const slugPreview = document.getElementById('slugPreview');
  const submitBtn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  const generalError = document.getElementById('generalError');
  const successMessage = document.getElementById('successMessage');
  
  // Update slug preview
  slugInput.addEventListener('input', function() {
    slugPreview.textContent = this.value || 'your-slug';
  });
  
  // Handle form submission
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Clear previous errors
    document.querySelectorAll('.error').forEach(el => el.textContent = '');
    generalError.style.display = 'none';
    successMessage.style.display = 'none';
    
    // Get form data
    const formData = {
      company_name: document.getElementById('companyName').value,
      company_slug: document.getElementById('companySlug').value,
      admin_username: document.getElementById('adminUsername').value,
      admin_email: document.getElementById('adminEmail').value,
    };
    
    // Show loading
    loading.style.display = 'block';
    submitBtn.disabled = true;
    
    // Send to API
    fetch('/dose/api/founders/signup/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formData),
    })
    .then(response => response.json())
    .then(data => {
      loading.style.display = 'none';
      submitBtn.disabled = false;
      
      if (data.success) {
        // Redirect to Lemon Squeezy checkout
        window.location.href = data.checkout_url;
      } else {
        // Display errors
        if (data.errors) {
          if (data.errors._) {
            generalError.textContent = data.errors._;
            generalError.style.display = 'block';
          }
          if (data.errors.company_name) {
            document.getElementById('errorCompanyName').textContent = data.errors.company_name;
          }
          if (data.errors.company_slug) {
            document.getElementById('errorCompanySlug').textContent = data.errors.company_slug;
          }
          if (data.errors.admin_username) {
            document.getElementById('errorAdminUsername').textContent = data.errors.admin_username;
          }
          if (data.errors.admin_email) {
            document.getElementById('errorAdminEmail').textContent = data.errors.admin_email;
          }
        }
      }
    })
    .catch(error => {
      loading.style.display = 'none';
      submitBtn.disabled = false;
      generalError.textContent = 'An error occurred. Please try again.';
      generalError.style.display = 'block';
      console.error('Error:', error);
    });
  });
});
</script>
