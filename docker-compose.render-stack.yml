# Local / lab stack mirroring Render backing services (Postgres, RabbitMQ, ES, Grafana, MonitorLogger).
# PolySaaS core (DOSE) runs inside Django — not a separate product. This file only starts backing services;
# run DOSE via manage.py on the host against these ports, or use Dockerfile.django on Render (same codebase).
#
# Usage: docker compose -f docker-compose.render-stack.yml up -d
# See: documentation/deployment/render/RENDER-DEPLOYMENT-PLAN.md
#
# Note: Docker volume keys changed from older compose files; previous volumes may still exist under old names until you remove or migrate data.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ps-render-pg
    environment:
      POSTGRES_USER: dosedbadmin
      POSTGRES_PASSWORD: ${DOSE_DB_PASSWORD:-changeme}
      POSTGRES_DB: dosedbsaas
    ports:
      - "5433:5432"
    volumes:
      - renderstack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosedbadmin -d dosedbsaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ps-render-rmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - renderstack_rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ps-render-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - renderstack_es_data:/usr/share/elasticsearch/data
    mem_limit: 1g

  grafana:
    image: grafana/grafana:10.4.3
    container_name: ps-render-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - renderstack_grafana_data:/var/lib/grafana
    # No hard dependency on ES; add datasources in Grafana UI when ready.

  # MonitorLogger — PolySaaS product name; container image is upstream OpenObserve-compatible.
  monitorlogger:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: ps-render-monitorlogger
    environment:
      ZO_ROOT_USER_EMAIL: ${MONITORLOGGER_ROOT_USER_EMAIL:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${MONITORLOGGER_ROOT_USER_PASSWORD:-changeme}
      ZO_LOCAL_MODE: "true"
    ports:
      - "5080:5080"
    volumes:
      - renderstack_monitorlogger_data:/data

volumes:
  renderstack_pg_data:
  renderstack_rmq_data:
  renderstack_es_data:
  renderstack_grafana_data:
  renderstack_monitorlogger_data:
