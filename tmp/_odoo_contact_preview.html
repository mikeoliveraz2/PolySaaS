<!doctype html><html><head><meta charset='utf-8'><title>Contact style preview</title><style>html,body{margin:0;height:100%;background:#1a1d21}.ps-slack-mock{position:relative;min-height:100vh}
        .ps-slack-mock { position:relative; min-height:520px; display:grid; grid-template-columns:210px 1fr; background:#1a1d21; color:#d1d2d3; font:14px Arial,sans-serif; }
        .ps-slack-mock * { box-sizing:border-box; }
        .ps-slack-mock__sidebar { padding:18px 12px; background:#3f0e40; color:#fff; }
        .ps-slack-mock__workspace { font-size:18px; font-weight:700; margin-bottom:22px; }
        .ps-slack-mock__channel { display:block; width:100%; margin:4px 0; padding:7px 10px; border:0; border-radius:4px; background:transparent; color:#e8dce8; text-align:left; cursor:pointer; }
        .ps-slack-mock__channel.is-active { background:#1164a3; color:#fff; }
        .ps-slack-mock__main { display:flex; flex-direction:column; min-width:0; min-height:520px; }
        .ps-slack-mock__header { padding:15px 20px; border-bottom:1px solid #35373b; font-size:17px; font-weight:700; }
        .ps-slack-mock__messages { flex:1; padding:22px; overflow-y:auto; min-height:220px; }
        .ps-slack-mock__message { display:flex; gap:12px; margin-bottom:18px; }
        .ps-slack-mock__avatar { width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; border-radius:7px; background:#2eb67d; color:#101214; font-weight:800; }
        .ps-slack-mock__avatar.is-bot { background:#611f69; color:#fff; }
        .ps-slack-mock__name { font-weight:700; color:#fff; }
        .ps-slack-mock__time { margin-left:6px; color:#9a9b9d; font-size:12px; }
        .ps-slack-mock__body { margin:4px 0 0; white-space:pre-wrap; }
        .ps-slack-mock__actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
        .ps-slack-mock__action { padding:8px 12px; border:1px solid #565856; border-radius:5px; background:#222529; color:#fff; cursor:pointer; }
        .ps-slack-mock__action:hover { border-color:#2eb67d; }
        .ps-slack-mock__modal {
            display:none; position:absolute; inset:0; z-index:20;
            align-items:center; justify-content:center; padding:24px;
        }
        .ps-slack-mock__modal.is-open { display:flex; }
        .ps-slack-mock__modal.is-arming,
        .ps-slack-mock__modal.is-arming * { pointer-events:none !important; }
        .ps-slack-mock__modal-backdrop {
            position:absolute; inset:0; background:rgba(0,0,0,.55);
        }
        .ps-slack-mock__modal-dialog {
            position:relative; z-index:1; width:min(520px,100%);
            max-height:min(90%,520px); overflow:auto;
            border-radius:8px; background:#1a1d21;
            box-shadow:0 12px 40px rgba(0,0,0,.45);
            border:1px solid #3d4044;
        }
        .ps-slack-mock__modal-header {
            display:flex; align-items:center; justify-content:space-between;
            gap:12px; padding:16px 20px 8px;
            border-bottom:1px solid #3f0e40;
            background:linear-gradient(180deg,#4a154b 0%,#1a1d21 100%);
        }
        .ps-slack-mock__modal-title { margin:0; font-size:18px; font-weight:800; color:#fff; }
        .ps-slack-mock__modal-close {
            width:32px; height:32px; border:0; border-radius:6px;
            background:transparent; color:#d1d2d3; font-size:22px; line-height:1; cursor:pointer;
        }
        .ps-slack-mock__modal-close:hover { background:#222529; color:#fff; }
        .ps-slack-mock__modal-body { padding:8px 20px 4px; }
        .ps-slack-mock__modal-hint { margin:0 0 14px; color:#9a9b9d; font-size:13px; }
        .ps-slack-mock__form label {
            display:block; margin:0 0 12px; color:#d1d2d3; font-size:13px; font-weight:700;
        }
        .ps-slack-mock__form input,
        .ps-slack-mock__form textarea {
            display:block; width:100%; margin-top:6px; padding:10px 12px;
            border:1px solid #565856; border-radius:6px; background:#222529; color:#fff; font:14px Arial,sans-serif;
        }
        .ps-slack-mock__form input:focus,
        .ps-slack-mock__form textarea:focus {
            outline:none; border-color:#1d9bd1; box-shadow:0 0 0 1px #1d9bd1;
        }
        .ps-slack-mock__form textarea { min-height:72px; resize:vertical; font-weight:400; }
        .ps-slack-mock__modal-footer {
            display:flex; justify-content:flex-end; gap:8px;
            padding:12px 20px 16px; border-top:1px solid #35373b; margin-top:8px;
        }
        .ps-slack-mock__btn {
            padding:8px 14px; border-radius:6px; border:1px solid transparent;
            font:700 13px Arial,sans-serif; cursor:pointer;
        }
        .ps-slack-mock__btn--ghost {
            background:#222529; border-color:#565856; color:#fff;
        }
        .ps-slack-mock__btn--ghost:hover { border-color:#9a9b9d; }
        .ps-slack-mock__btn--primary {
            background:#007a5a; border-color:#007a5a; color:#fff;
        }
        .ps-slack-mock__btn--primary:hover { background:#148567; }
        .ps-slack-mock__btn:disabled { opacity:.55; cursor:default; }
        .ps-slack-mock__result { margin:0 22px 12px; padding:12px; border:1px solid #35373b; border-radius:5px; background:#222529; color:#86efac; font-family:Consolas,monospace; }
        .ps-slack-mock__composer { display:flex; gap:8px; margin:0 22px 18px; }
        .ps-slack-mock__composer input { flex:1; min-width:0; padding:10px 12px; border:1px solid #565856; border-radius:6px; background:#222529; color:#fff; }
        .ps-slack-mock__composer button { padding:10px 14px; border:0; border-radius:6px; background:#007a5a; color:#fff; font-weight:700; cursor:pointer; }
        @media (max-width:760px) { .ps-slack-mock { grid-template-columns:1fr; } .ps-slack-mock__sidebar { display:none; } }
        #ps-slack-modal-contact { padding:16px; }
        #ps-slack-modal-contact .ps-slack-mock__modal-backdrop { background:rgba(15,17,22,.42); }
        #ps-slack-modal-contact .ps-slack-mock__modal-dialog {
            width:min(920px,100%);
            max-height:min(92vh,760px);
            display:flex; flex-direction:column;
            border-radius:3px;
            background:#f0f0f0;
            border:0;
            box-shadow:0 12px 40px rgba(15,17,22,.28);
            color:#212529;
            font-family:Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
            overflow:hidden;
        }
        #ps-slack-modal-contact .ps-slack-mock__form label,
        #ps-slack-modal-contact .ps-slack-mock__form input,
        #ps-slack-modal-contact .ps-slack-mock__form textarea {
            all: unset;
            box-sizing:border-box;
        }
        #ps-slack-modal-contact .ps-odoo-contact__nav {
            display:flex; align-items:center; justify-content:space-between;
            padding:7px 16px; background:#714B67; color:#fff; flex:0 0 auto;
        }
        #ps-slack-modal-contact .ps-odoo-contact__nav-app { font:600 14px Roboto,"Segoe UI",sans-serif; }
        #ps-slack-modal-contact .ps-odoo-contact__nav-meta { font:12px Roboto,"Segoe UI",sans-serif; opacity:.85; }
        #ps-slack-modal-contact .ps-odoo-contact__cp {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding:8px 16px; background:#f8f9fa; border-bottom:1px solid #dee2e6; flex:0 0 auto;
        }
        #ps-slack-modal-contact .ps-odoo-contact__bc { font-size:13px; color:#6c757d; }
        #ps-slack-modal-contact .ps-odoo-contact__bc strong { color:#212529; font-weight:700; }
        #ps-slack-modal-contact .ps-odoo-contact__status {
            flex:1; min-width:0; text-align:right;
            font:12px Consolas,monospace; color:#714B67;
        }
        #ps-slack-modal-contact .ps-odoo-contact__cp-actions { display:flex; align-items:center; gap:8px; }
        #ps-slack-modal-contact .ps-odoo-contact__discard {
            background:transparent; border:0; color:#6c757d;
            font:600 13px Roboto,"Segoe UI",sans-serif; cursor:pointer; padding:6px 8px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__discard:hover { color:#212529; }
        #ps-slack-modal-contact .ps-odoo-contact__save {
            background:#714B67; border:0; color:#fff; border-radius:4px;
            padding:5px 14px; font:700 13px Roboto,"Segoe UI",sans-serif; cursor:pointer;
        }
        #ps-slack-modal-contact .ps-odoo-contact__save:hover { background:#5e3d56; }
        #ps-slack-modal-contact .ps-odoo-contact__save:disabled { opacity:.55; cursor:default; }
        #ps-slack-modal-contact .ps-slack-mock__modal-close {
            width:28px; height:28px; color:#6c757d; font-size:20px;
        }
        #ps-slack-modal-contact .ps-slack-mock__modal-close:hover { background:#e9ecef; color:#212529; }
        #ps-slack-modal-contact .ps-odoo-contact__canvas {
            flex:1 1 auto; overflow:auto; padding:10px 16px 16px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__sheet {
            background:#fff; padding:16px 22px 18px;
            box-shadow:0 1px 4px rgba(0,0,0,.12); border-radius:3px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__title-row {
            display:grid; grid-template-columns:80px 1fr; gap:18px; align-items:start; margin-bottom:4px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__avatar {
            width:80px; height:80px; border-radius:50%; background:#e9ecef; color:#8d939a;
            display:grid; place-items:center; position:relative; overflow:hidden;
        }
        #ps-slack-modal-contact .ps-odoo-contact__avatar-icon { width:42px; height:42px; fill:currentColor; }
        #ps-slack-modal-contact .ps-odoo-contact__avatar-letter {
            font:700 34px Roboto,"Segoe UI",sans-serif; color:#714B67; line-height:1;
        }
        #ps-slack-modal-contact .ps-odoo-contact__avatar-letter[hidden] { display:none; }
        #ps-slack-modal-contact .ps-odoo-contact__type {
            display:flex; gap:18px; margin:4px 0 6px; font-size:13px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__type label {
            display:inline-flex; align-items:center; gap:6px; margin:0;
            font:600 13px Roboto,"Segoe UI",sans-serif; color:#212529; cursor:pointer;
        }
        #ps-slack-modal-contact .ps-odoo-contact__type input[type="radio"] {
            appearance:auto; -webkit-appearance:radio;
            display:inline-block; width:14px; height:14px; margin:0;
            accent-color:#714B67; cursor:pointer;
        }
        #ps-slack-modal-contact .ps-odoo-contact__name {
            display:block; width:100%; border:0; border-bottom:1px solid #ced4da;
            background:transparent; padding:4px 0 6px;
            font:700 24px Roboto,"Segoe UI",sans-serif; color:#212529;
        }
        #ps-slack-modal-contact .ps-odoo-contact__name::placeholder { color:#adb5bd; font-weight:500; }
        #ps-slack-modal-contact .ps-odoo-contact__name:focus { outline:none; border-bottom-color:#714B67; }
        #ps-slack-modal-contact .ps-odoo-contact__tabs {
            display:flex; gap:18px; border-bottom:1px solid #dee2e6; margin:10px 0 12px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__tab {
            padding:8px 0 7px; border:0; background:transparent; color:#6c757d;
            font:600 13px Roboto,"Segoe UI",sans-serif; cursor:default;
        }
        #ps-slack-modal-contact .ps-odoo-contact__tab.is-active {
            color:#714B67; border-bottom:2px solid #714B67;
        }
        #ps-slack-modal-contact .ps-odoo-contact__groups {
            display:grid; grid-template-columns:1fr 1fr; gap:8px 40px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__row {
            display:grid; grid-template-columns:88px 1fr; gap:10px; align-items:center; min-height:32px;
        }
        #ps-slack-modal-contact .ps-odoo-contact__row--stack { align-items:start; }
        #ps-slack-modal-contact .ps-odoo-contact__row--stack label { padding-top:6px; }
        #ps-slack-modal-contact .ps-odoo-contact__row label {
            margin:0; color:#6c757d; font:13px Roboto,"Segoe UI",sans-serif;
        }
        #ps-slack-modal-contact .ps-odoo-contact__row input {
            display:block; width:100%; margin:0; padding:4px 0;
            border:0; border-bottom:1px solid #ced4da; border-radius:0;
            background:transparent; color:#212529;
            font:14px Roboto,"Segoe UI",sans-serif;
        }
        #ps-slack-modal-contact .ps-odoo-contact__row input:focus {
            outline:none; border-bottom-color:#714B67; box-shadow:none;
        }
        #ps-slack-modal-contact .ps-odoo-contact__row input::placeholder { color:#adb5bd; }
        @media (max-width:720px) {
            #ps-slack-modal-contact .ps-odoo-contact__title-row,
            #ps-slack-modal-contact .ps-odoo-contact__groups { grid-template-columns:1fr; }
        }
    .ps-slack-mock__modal{display:flex!important}</style></head><body><div class="ps-slack-mock"><div class="ps-slack-mock__modal is-open" id="ps-slack-modal-contact" data-kind="contact" role="dialog" aria-modal="true" aria-labelledby="ps-slack-modal-contact-title">
        <div class="ps-slack-mock__modal-backdrop"></div>
        <div class="ps-slack-mock__modal-dialog">
            <div class="ps-odoo-contact__nav">
                <span class="ps-odoo-contact__nav-app">Contacts</span>
                <span class="ps-odoo-contact__nav-meta">My Company</span>
            </div>
            <div class="ps-odoo-contact__cp">
                <div class="ps-odoo-contact__bc">Contacts / <strong id="ps-slack-modal-contact-title">New</strong></div>
                <span class="ps-odoo-contact__status" data-form-status="contact" aria-live="polite"></span>
                <div class="ps-odoo-contact__cp-actions">
                    <button type="button" class="ps-odoo-contact__discard" data-modal-dismiss="contact">Discard</button>
                    <button type="button" class="ps-odoo-contact__save" data-form-submit="contact">Save</button>
                    <button type="button" class="ps-slack-mock__modal-close" data-modal-dismiss="contact" aria-label="Close">&times;</button>
                </div>
            </div>
            <div class="ps-odoo-contact__canvas">
            <div class="ps-slack-mock__form ps-odoo-contact__sheet" id="ps-slack-form-contact" data-kind="contact" role="form">
                <div class="ps-odoo-contact__title-row">
                    <div class="ps-odoo-contact__avatar" data-contact-avatar aria-hidden="true">
                        <svg class="ps-odoo-contact__avatar-icon" viewBox="0 0 24 24" focusable="false">
                            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                        </svg>
                        <span class="ps-odoo-contact__avatar-letter"></span>
                    </div>
                    <div>
                        <div class="ps-odoo-contact__type">
                            <label><input name="is_company" form="ps-slack-modal-sink" type="radio" value="" checked> Individual</label>
                            <label><input name="is_company" form="ps-slack-modal-sink" type="radio" value="1"> Company</label>
                        </div>
                        <input class="ps-odoo-contact__name" name="name" form="ps-slack-modal-sink" type="text" required maxlength="120" placeholder="e.g. Lumber Inc" autocomplete="off">
                    </div>
                </div>
                <div class="ps-odoo-contact__tabs">
                    <button type="button" class="ps-odoo-contact__tab is-active">Contact</button>
                    <button type="button" class="ps-odoo-contact__tab" tabindex="-1">Sales &amp; Purchase</button>
                </div>
                <div class="ps-odoo-contact__groups">
                    <div>
                        <div class="ps-odoo-contact__row ps-odoo-contact__row--stack">
                            <label>Address</label>
                            <input name="street" form="ps-slack-modal-sink" type="text" maxlength="120" placeholder="Street..." autocomplete="off">
                        </div>
                        <div class="ps-odoo-contact__row">
                            <label>City</label>
                            <input name="city" form="ps-slack-modal-sink" type="text" maxlength="80" autocomplete="off">
                        </div>
                        <div class="ps-odoo-contact__row">
                            <label>ZIP</label>
                            <input name="zip" form="ps-slack-modal-sink" type="text" maxlength="20" autocomplete="off">
                        </div>
                    </div>
                    <div>
                        <div class="ps-odoo-contact__row">
                            <label>Phone</label>
                            <input name="phone" form="ps-slack-modal-sink" type="text" maxlength="40" placeholder="+1 555 0100" autocomplete="off">
                        </div>
                        <div class="ps-odoo-contact__row">
                            <label>Email</label>
                            <input name="email" form="ps-slack-modal-sink" type="email" maxlength="120" placeholder="contact@example.com" autocomplete="off">
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
    <div class="ps-slack-mock__modal is-open" </div></body></html>
