# OpenClaw-style external router (Option 2) — edit and mount or bake into image.
# Buckets: lite | standard | heavy (aligned with Django llm_router app).

thresholds:
  lite_max_chars: 1500
  standard_max_chars: 12000

routes:
  lite:
    provider: anthropic
    model: claude-3-5-haiku-20241022
  standard:
    provider: anthropic
    model: claude-sonnet-4-6
  heavy:
    provider: anthropic
    model: claude-sonnet-4-6

server:
  host: "0.0.0.0"
  port: 8765
