version: '3.8'

# PolySaaS Cross-App Sync Demo
# Dolibarr (CRM) → RabbitMQ → Odoo (ERP)
# Usage: docker-compose -f docker-compose.demo-sync.yml up -d

services:

  # --- RabbitMQ Message Broker ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: polysaas-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: polysaas
      RABBITMQ_DEFAULT_PASS: polysaas123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Odoo ERP ---
  odoo-db:
    image: postgres:16
    container_name: polysaas-odoo-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U odoo
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: polysaas-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/login"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- Dolibarr CRM ---
  dolibarr-db:
    image: mariadb:10.11
    container_name: polysaas-dolibarr-db
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr_root
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    volumes:
      - dolibarr_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  dolibarr:
    image: tuxgasy/dolibarr:latest
    container_name: polysaas-dolibarr
    depends_on:
      dolibarr-db:
        condition: service_healthy
    ports:
      - "8889:80"
    environment:
      DOLI_DB_HOST: dolibarr-db
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarr
      DOLI_DB_NAME: dolibarr
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin
      DOLI_URL_ROOT: http://localhost:8889
      DOLI_MODULES: modSociete,modFacture,modFournisseur,modApi
    volumes:
      - dolibarr_docs:/var/www/documents
      - dolibarr_html:/var/www/html/custom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  rabbitmq_data:
  odoo_db_data:
  odoo_data:
  odoo_addons:
  dolibarr_db_data:
  dolibarr_docs:
  dolibarr_html:
