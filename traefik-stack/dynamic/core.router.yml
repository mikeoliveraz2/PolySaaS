http:
  routers:
    # Main Production Dashboard / Django Core
    production-core:
      rule: "Host(production.polysaas.online)"
      service: PolySaaS-Core
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 100

    # Example for other services (add more as needed)
    production-odoo:
      rule: "Host(production.polysaas.online) && PathPrefix(/odoo)"
      service: PolySaaS-Odoo
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - strip-odoo

  services:
    PolySaaS-Core:
      loadBalancer:
        servers:
          - url: "http://PolySaaS-Core:8000"

    PolySaaS-Odoo:
      loadBalancer:
        servers:
          - url: "http://PolySaaS-Odoo:8069"

  middlewares:
    strip-odoo:
      stripPrefix:
        prefixes:
          - "/odoo"
        forceSlash: true
