# Dynamic Traefik configuration for Hostinger / Dokploy (local lab optional).
# Prefer deploy/hostinger Traefik labels in production.

http:
  routers:
    polysaas-core:
      rule: "Host(`app.prod-polysaas.cloud`)"
      service: polysaas-core
      entryPoints:
        - web
      priority: 100

    odoo:
      rule: "Host(`odoo.prod-polysaas.cloud`)"
      service: odoo
      entryPoints:
        - web
      priority: 100

    mattermost:
      rule: "Host(`mm.prod-polysaas.cloud`)"
      service: mattermost
      entryPoints:
        - web
      priority: 100

  services:
    polysaas-core:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://django:8000

    odoo:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://odoo:8069

    mattermost:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://mattermost:8065
