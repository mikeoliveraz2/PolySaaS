# Traefik static config — Hostinger PolySaaS stack
# ACME stores certs under /letsencrypt (compose volume)

api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: polysaas-hostinger

certificatesResolvers:
  letsencrypt:
    acme:
      # TLS-ALPN-01 — avoids conflict with entrypoint HTTP→HTTPS redirect
      email: admin@polysaas.online
      storage: /letsencrypt/acme.json
      tlsChallenge: {}

log:
  level: INFO
