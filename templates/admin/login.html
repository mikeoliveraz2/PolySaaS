{% load static %}
<div style="background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.18);padding:32px 28px;margin:60px auto;max-width:420px;text-align:center;">
    <img src="{% static 'img/PolySaaS-Industrial-Logo.png' %}" alt="PolySaaS" style="height:64px;width:auto;margin-bottom:12px;">
    <h1 style="color:#2c3e50;font-size:1.25rem;margin:0 0 6px;">PolySaaS</h1>
    <p style="color:#5a6c7d;font-size:.88rem;margin:0 0 20px;font-style:italic;">Industrial Strength SaaS for Limitless Horizons</p>
    <p style="color:#666;font-size:.85rem;margin:0 0 16px;">Username is not case-sensitive. Password is case-sensitive.</p>
    <form method="post" action="{{ app_path }}" style="text-align:left;margin-bottom:14px;">
        {% csrf_token %}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <div style="margin-bottom:16px;">{{ form.as_p }}</div>
        <button type="submit" style="background:#457894;color:#fff;width:100%;padding:11px;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;">Sign in</button>
    </form>
    <a href="/accounts/google/login/?prompt=select_account" style="display:block;background:#4285f4;color:#fff;padding:10px;border-radius:6px;text-align:center;font-size:.95rem;font-weight:600;text-decoration:none;">
        Sign in with Google
    </a>
</div>
