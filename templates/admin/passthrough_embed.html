{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}{{ embed_title }} - {{ block.super }}{% endblock %}

{% block extrahead %}
{{ block.super }}
{{ embed_head }}
<style>
    /* Passthrough scope container */
    .polysaas-passthrough-scope {
        width: 100%;
        min-height: 600px;
        background: #fff;
        border-radius: 4px;
        padding: 0;
        margin: 0;
    }
    
    /* Ensure content stays within admin layout */
    #content-main {
        padding: 0 !important;
    }
    
    /* Protect sidebar */
    #jazzy-sidebar,
    .main-sidebar {
        z-index: 1000 !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="passthrough-container polysaas-passthrough-scope">
    {{ embed_body }}
</div>
{% endblock %}
