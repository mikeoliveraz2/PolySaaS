{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}OSTicket - Support Center{% endblock %}

{% block extrahead %}
{{ block.super }}
<!-- FORCE CSS IN ADMIN TEMPLATE -->
<link rel="stylesheet" href="/static/osticket/css/login.css">
<link rel="stylesheet" href="/static/osticket/css/font-awesome.min.css?a88b54b">
<script src="/static/osticket/js/jquery-3.7.0.min.js?a88b54b"></script>
{% if osticket_head %}
{{ osticket_head|safe }}
{% endif %}
<style>
    /* Keep content in admin layout - NOT full screen */
    /* Ensure we stay within the admin content area */
    body {
        overflow: visible !important;
    }
    #content {
        padding: 20px !important;
        max-width: calc(100% - 250px) !important; /* Account for sidebar width */
        margin-left: 250px !important; /* Push content to right of sidebar */
        margin-right: 0 !important;
    }
    #content-main {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: auto !important;
    }
    .module { padding: 0 !important; }

    /* Ensure OSTicket content doesn't break out of admin layout */
    #content > div {
        max-width: 100% !important;
        overflow-x: auto !important;
    }

    /* CRITICAL: Protect admin sidebar from OSTicket CSS bleeding */
    #jazzy-sidebar,
    .main-sidebar,
    .nav-sidebar {
        background-color: #1f4788 !important;
        color: #c0c0c0 !important;
        z-index: 1000 !important;
    }

    #jazzy-sidebar a,
    #jazzy-sidebar .nav-link,
    .nav-sidebar a,
    .nav-sidebar .nav-link {
        color: #c0c0c0 !important;
    }

    #jazzy-sidebar a:hover,
    #jazzy-sidebar .nav-link:hover,
    .nav-sidebar a:hover,
    .nav-sidebar .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
    }

    /* CRITICAL: Fix OSTicket modal/overlay - make it display inline and clickable */
    body#loginBody {
        position: static !important;
        height: auto !important;
        min-height: 100vh !important;
        overflow: visible !important;
        padding: 20px !important;
    }

    div#loginBox {
        position: static !important;
        width: 400px !important;
        margin: 40px auto !important;
        transform: none !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        z-index: 1 !important;
        pointer-events: auto !important;
    }

    #brickwall,
    div#blur,
    div#background {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
    }

    /* CRITICAL: Make form and inputs clickable */
    form#login,
    form#login input[type="text"],
    form#login input[type="password"],
    form#login button,
    form#login fieldset {
        pointer-events: auto !important;
        position: relative !important;
        z-index: 100 !important;
    }

    div#poweredBy {
        position: static !important;
        bottom: auto !important;
        text-align: center !important;
        margin-top: 20px !important;
    }

    /* OSTicket Login Form Styling (since we removed login.css) */
    body#loginBody {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        padding: 40px 20px !important;
        min-height: calc(100vh - 100px) !important;
    }

    div#loginBox {
        background: white;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        padding: 40px;
        max-width: 400px;
        margin: 40px auto;
    }

    #loginBox #logo {
        text-align: center;
        margin-bottom: 30px;
    }

    #loginBox #logo img {
        max-width: 200px;
        height: auto;
    }

    #loginBox h3 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 18px;
    }

    #login fieldset {
        border: none;
        padding: 0;
        margin: 0;
    }

    #login input[type="text"],
    #login input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
        transition: border-color 0.3s;
    }

    #login input[type="text"]:focus,
    #login input[type="password"]:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    #login button[type="submit"] {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #login button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    #reset-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
    }

    #reset-link:hover {
        text-decoration: underline;
    }

    #company {
        text-align: center;
        margin-top: 30px;
        color: #666;
        font-size: 12px;
    }

    div#poweredBy {
        text-align: center;
        margin-top: 20px;
        padding: 10px;
        color: #999;
        font-size: 12px;
    }

    div#poweredBy img {
        max-width: 100px;
        opacity: 0.5;
    }
</style>
{% endblock %}

{% block content %}
<div id="osticket-container" style="margin: 0; padding: 0; max-width: 100%; overflow-x: auto;">
    {{ osticket_content|safe }}
</div>

<script>
// CRITICAL: Force remove modal styling after page loads
document.addEventListener('DOMContentLoaded', function() {
    console.log('[OSTICKET WRAPPER] Page loaded, initializing...');

    // ===== LOGGING: Check what form actions exist =====
    const forms = document.querySelectorAll('form');
    console.log('[OSTICKET WRAPPER] Found ' + forms.length + ' form(s) on page');
    forms.forEach((form, idx) => {
        console.log('[OSTICKET WRAPPER] Form ' + idx + ':', {
            id: form.id || 'no-id',
            name: form.name || 'no-name',
            action: form.getAttribute('action') || 'no-action-attr',
            form_action: form.action || 'no-form.action',
            method: form.method || 'no-method'
        });
    });

    console.log('[OSTICKET WRAPPER] Removing modal overlay styling...');

    // Remove background overlays
    const brickwall = document.getElementById('brickwall');
    const blur = document.getElementById('blur');
    const background = document.getElementById('background');
    if (brickwall) brickwall.remove();
    if (blur) blur.remove();
    if (background) background.remove();

    // Fix loginBox positioning
    const loginBox = document.getElementById('loginBox');
    if (loginBox) {
        loginBox.style.position = 'relative';
        loginBox.style.width = '400px';
        loginBox.style.margin = '40px auto';
        loginBox.style.transform = 'none';
        loginBox.style.top = 'auto';
        loginBox.style.left = 'auto';
    }

    // Fix loginBody
    const loginBody = document.getElementById('loginBody');
    if (loginBody) {
        loginBody.style.position = 'relative';
        loginBody.style.height = 'auto';
        loginBody.style.minHeight = '100vh';
        loginBody.style.overflow = 'visible';
    }

    // Make inputs clickable
    const inputs = document.querySelectorAll('#login input, #login button');
    inputs.forEach(input => {
        input.style.pointerEvents = 'auto';
        input.style.position = 'relative';
        input.style.zIndex = '100';
    });

    // ===== CRITICAL: Rewrite form actions to go through Django proxy =====
    forms.forEach((form, idx) => {
        const oldAction = form.getAttribute('action') || form.action || '';
        console.log('[OSTICKET WRAPPER] Processing form ' + idx + ', current action:', oldAction);

        if (oldAction && !oldAction.startsWith('/admin/osticket/') && oldAction !== '') {
            // Rewrite external URL to proxy path
            let newAction = oldAction
                .replace(/https?:\/\/[^\/]+\//g, '/admin/osticket/')  // Replace domain with proxy path
                .replace(/^\//, '/admin/osticket/')                     // Root-relative paths
                .replace(/^(?!\/admin\/osticket\/)/, '/admin/osticket/'); // Relative paths

            // Ensure it starts with /admin/osticket/
            if (!newAction.startsWith('/admin/osticket/')) {
                newAction = '/admin/osticket/' + newAction;
            }

            console.log('[OSTICKET WRAPPER] Rewriting form action:', oldAction, '→', newAction);
            form.setAttribute('action', newAction);
            form.action = newAction;
        }
    });

    // ===== LOGGING: Intercept form submission =====
    document.addEventListener('submit', function(e) {
        const form = e.target;
        console.log('[OSTICKET WRAPPER] Form submit detected:', {
            form_id: form.id,
            form_name: form.name,
            action: form.action,
            method: form.method,
            form_data_count: new FormData(form).entries().length
        });
    }, true);

    console.log('[OSTICKET WRAPPER] Modal styling removed, inputs enabled, form actions checked');
});
</script>
{% endblock %}
