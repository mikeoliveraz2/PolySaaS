{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}{{ service_name }} - External Service{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Keep content in admin layout - NOT full screen */
    /* Ensure we stay within the admin content area */
    body {
        overflow: visible !important;
    }
    #content {
        padding: 20px !important;
        max-width: calc(100% - 250px) !important; /* Account for sidebar width */
        margin-left: 250px !important; /* Push content to right of sidebar */
        margin-right: 0 !important;
    }
    #content-main {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: auto !important;
    }
    .module { padding: 0 !important; }

    /* Ensure external service content doesn't break out of admin layout */
    #content > div {
        max-width: 100% !important;
        overflow-x: auto !important;
    }

    /* CRITICAL: Protect admin sidebar from external service CSS bleeding */
    #jazzy-sidebar,
    .main-sidebar,
    .nav-sidebar {
        background-color: #1f4788 !important;
        color: #c0c0c0 !important;
        z-index: 1000 !important;
    }

    #jazzy-sidebar a,
    #jazzy-sidebar .nav-link,
    .nav-sidebar a,
    .nav-sidebar .nav-link {
        color: #c0c0c0 !important;
    }

    #jazzy-sidebar a:hover,
    #jazzy-sidebar .nav-link:hover,
    .nav-sidebar a:hover,
    .nav-sidebar .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
    }

    /* Generic fixes for common external service issues */
    body.modal-open {
        position: static !important;
        height: auto !important;
        min-height: 100vh !important;
        overflow: visible !important;
        background: #f5f5f5 !important;
        padding: 20px !important;
    }

    .modal-backdrop,
    .modal-overlay,
    #brickwall,
    div#blur,
    div#background {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
    }

    /* Make forms and inputs clickable */
    form input,
    form button,
    form select,
    form textarea,
    fieldset {
        pointer-events: auto !important;
        position: relative !important;
        z-index: 1 !important;
    }
</style>
{% endblock %}

{% block content %}
<div id="external-service-container" style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: visible;">
    {{ service_content|safe }}
</div>

<script>
// Generic fixes for external services
document.addEventListener('DOMContentLoaded', function() {
    console.log('[EXTERNAL SERVICE FIX] Applying generic fixes...');

    // Remove common modal overlays
    const overlays = document.querySelectorAll('.modal-backdrop, .modal-overlay, #brickwall, #blur, #background');
    overlays.forEach(overlay => overlay.remove());

    // Fix modal body positioning
    const modalBodies = document.querySelectorAll('body.modal-open, #loginBody');
    modalBodies.forEach(body => {
        body.style.position = 'relative';
        body.style.height = 'auto';
        body.style.minHeight = '100vh';
        body.style.overflow = 'visible';
        body.style.background = '#f5f5f5';
        body.style.padding = '20px';
    });

    // Fix modal dialogs
    const modals = document.querySelectorAll('.modal, #loginBox, .dialog');
    modals.forEach(modal => {
        modal.style.position = 'relative';
        modal.style.width = 'auto';
        modal.style.maxWidth = '800px';
        modal.style.margin = '40px auto';
        modal.style.transform = 'none';
        modal.style.top = 'auto';
        modal.style.left = 'auto';
        modal.style.right = 'auto';
        modal.style.bottom = 'auto';
        modal.style.zIndex = '1';
        modal.style.pointerEvents = 'auto';
    });

    // Make all form elements clickable
    const formElements = document.querySelectorAll('input, button, select, textarea, a');
    formElements.forEach(element => {
        element.style.pointerEvents = 'auto';
        element.style.position = 'relative';
        element.style.zIndex = '100';
    });

    console.log('[EXTERNAL SERVICE FIX] Generic fixes applied');
});
</script>
<style>
  body[data-path*="/nextcloud/"] #header,
  body[data-path*="/nextcloud/"] #appmenu,
  body[data-path*="/nextcloud/"] #app-navigation,
  body[data-path*="/nextcloud/"] .app-navigation {
    display: none !important;
  }
  body[data-path*="/nextcloud/"] #app-content {
    margin-left: 0 !important;
  }
</style>
{% endblock %}
