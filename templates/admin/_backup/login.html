{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto; background: #181a1b; border-radius: 10px; box-shadow: 0 2px 12px rgba(44,62,80,0.15); padding: 2rem; color: #fff; position: relative;">
    <div style="position: absolute; top: 1.2rem; right: 1.2rem;">
        <button id="admin-theme-toggle-btn" style="background: none; border: none; color: #e6c34d; font-size: 1.7rem; cursor: pointer;" title="Toggle theme">
            <span id="admin-theme-toggle-icon">&#9728;</span>
        </button>
    </div>
    <h2 style="text-align:center; color:#e6c34d; margin-bottom:2rem; font-weight:400;">D.O.S.E. Administration</h2>
    <form method="post" style="margin-bottom: 1.5rem;">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom:1.2rem;">
            <label for="username" style="color:#e6c34d; font-weight:500;">Username:</label>
            <input type="text" id="username" name="username" required style="width:100%; padding:0.7rem; border-radius:6px; border:1px solid #2c3e50; background:#23272a; color:#fff;">
        </div>
        <div class="form-group" style="margin-bottom:1.2rem;">
            <label for="password" style="color:#e6c34d; font-weight:500;">Password:</label>
            <input type="password" id="password" name="password" required style="width:100%; padding:0.7rem; border-radius:6px; border:1px solid #2c3e50; background:#23272a; color:#fff;">
        </div>
        <button type="submit" class="btn" style="width:100%; background:#457894; color:#fff; border:none; border-radius:6px; padding:0.8rem; font-size:1rem; font-weight:600; margin-top:0.5rem;">Log in</button>
    </form>
    <div style="text-align:center; margin-top:1.5rem;">
        <a href="/accounts/google/login/" class="subscription-btn" style="background:#4285F4; color:#fff; display:inline-block; width:auto; padding:0.75em 2em; font-size:1em; font-weight:600; border-radius:4px; text-decoration:none;">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" style="height:1em; vertical-align:middle; margin-right:0.5em;"> Login with Google
        </a>
    </div>
    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{% url 'dose:subscribe' %}" style="color: #2980b9; text-decoration: underline; font-weight: bold; font-size: 1.1rem;">Sign Up</a>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('admin-theme-toggle-btn');
    var icon = document.getElementById('admin-theme-toggle-icon');
    function updateIcon(mode) {
        if (icon) {
            icon.textContent = mode === 'dark' ? '\u263D' : '\u2600';
            icon.title = mode === 'dark' ? 'Switch to day mode' : 'Switch to night mode';
        }
    }
    function setTheme(mode) {
        if (mode === 'dark') {
            document.body.style.backgroundColor = '#181a1b';
        } else {
            document.body.style.backgroundColor = '#f5f5f5';
        }
        updateIcon(mode);
        localStorage.setItem('adminTheme', mode);
    }
    btn.addEventListener('click', function() {
        var current = localStorage.getItem('adminTheme') || 'dark';
        var next = current === 'dark' ? 'light' : 'dark';
        setTheme(next);
    });
    setTheme(localStorage.getItem('adminTheme') || 'dark');
});
</script>
{% endblock %}
