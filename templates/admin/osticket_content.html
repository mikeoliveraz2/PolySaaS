{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}OSTicket - Admin{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
:root {
    --dose-primary: #457894;
    --dose-secondary: #3498db;
    --dose-dark: #2c3e50;
    --dose-light: #f5f5f5;
}

/* OSTicket-specific content styling only */
#osticket-container {
    background: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 20px;
}

.osticket-toolbar {
    margin-bottom: 1em;
    display: flex;
    gap: 0.5em;
    align-items: center;
}

.btn-osticket {
    background: var(--dose-secondary);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
}

.btn-osticket:hover {
    background: #2980b9;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
}

.osticket-status {
    font-size: 0.9em;
    color: #666;
}
</style>
{% endblock %}

{% block content %}
<h1>OSTicket Support System</h1>

<div class="osticket-toolbar">
    <button class="btn-osticket" id="btn-refresh" onclick="location.reload();">🔄 Refresh</button>
    <button class="btn-osticket" id="btn-new-tab" onclick="window.open('http://127.0.0.1:8001/admin/osticket/login.php', '_blank');">↗ Open in Full Window</button>
    <span class="osticket-status" id="status-msg">Ready</span>
</div>

<div id="osticket-container">
    {% autoescape off %}
    {{ osticket_content }}
    {% endautoescape %}
</div>

<script>
// The content is already rendered by Django via the proxy
// Just add some client-side enhancements if needed
console.log('OSTicket content loaded from proxy');
</script>
{% endblock %}
