                    {% for t in theme_list %}

                    {% endfor %}
                </select>
            </div>

        <div class="mb-2">
            <label style="margin-bottom:0.5em;display:block;">Last Saved Theme:</label>
            <input type="text" class="form-control" value="{{ jazzmin_theme }}" readonly style="width:100%;margin-bottom:1em;padding:8px 12px;border-radius:6px;border:1px solid #bbb;background:#222;color:#f8f9fa;font-size:1em;box-sizing:border-box;" />
        </div>

        <div class="form-check mb-3" style="margin-bottom:1em;">
            <input class="form-check-input" type="checkbox" id="display-mode-toggle" checked style="margin-right:0.5em;">
            <label class="form-check-label" for="display-mode-toggle" style="margin-bottom:0.5em;">Use light theme for display</label>
        </div>

        <div class="mb-1">
            <label for="jazzmin-dark-mode-theme-chooser" style="margin-bottom:0.5em;display:block;font-weight:500;">Dark Theme:</label>
            <div style="display:flex;">
                <select name="theme" id="jazzmin-dark-mode-theme-chooser" style="flex:1 1 0%;margin-bottom:1em;padding:8px 12px;border-radius:6px;border:1px solid #bbb;background:#222;color:#f8f9fa;font-size:1em;box-sizing:border-box;">

                    {% for t in dark_theme_list %}
                        <option value="{{ t }}" {% if jazzmin_dark_theme == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="display:flex;">
            <button id="save-theme-btn" class="btn btn-primary btn-block mb-3" style="background:#007bff;color:#fff;font-weight:bold;border:none;border-radius:6px;padding:8px 12px;font-size:1.1em;flex:1 1 0%;box-sizing:border-box;margin-bottom:0;">Save</button>
        </div>
            </div>

    <!-- Removed vertical spacer above Small Text section -->
    <!-- Removed duplicate Save button -->

        <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Force select values to match context variables
            var themeSelector = document.getElementById('jazzmin-theme-chooser');
            var darkThemeSelector = document.getElementById('jazzmin-dark-mode-theme-chooser');
            if (themeSelector) {
                themeSelector.value = "{{ jazzmin_light_theme|escapejs }}";
            }
            if (darkThemeSelector) {
                darkThemeSelector.value = "{{ jazzmin_dark_theme|escapejs }}";
            }
        });
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        document.addEventListener('DOMContentLoaded', function() {
            const saveBtn = document.getElementById('save-theme-btn');
            const themeSelector = document.getElementById('jazzmin-theme-chooser');
            const darkThemeSelector = document.getElementById('jazzmin-dark-mode-theme-chooser');
            if (saveBtn && themeSelector && darkThemeSelector) {
                saveBtn.addEventListener('click', function() {
                    const selectedTheme = themeSelector.value;
                    const selectedDarkTheme = darkThemeSelector.value;
                    const displayModeToggle = document.getElementById('display-mode-toggle');
                    const displayMode = displayModeToggle && displayModeToggle.checked ? 'light' : 'dark';
                    console.log('[ThemePicker] Save POST:', {
                        light_theme: selectedTheme,
                        dark_theme: selectedDarkTheme,
                        display_mode: displayMode
                    });
                    const formData = new URLSearchParams();
                    formData.append('light_theme', selectedTheme);
                    formData.append('dark_theme', selectedDarkTheme);
                    formData.append('display_mode', displayMode);
                    fetch('/admin/select-theme/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                            'X-CSRFToken': csrftoken,
                        },
                        body: formData.toString()
                    })
                    .then(response => {
                        console.log('[ThemePicker] Save response:', response);
                        if (response.ok) {
                            alert('Theme saved successfully!');
                            window.location.href = '/admin/';
                        } else {
                            console.error('[ThemePicker] Save failed:', response);
                            alert('Failed to save theme');
                        }
                    })
                    .catch(error => {
                        console.error('[ThemePicker] Save error:', error);
                        alert('Error saving theme: ' + error);
                    });
                });
            }
        });
        </script>
