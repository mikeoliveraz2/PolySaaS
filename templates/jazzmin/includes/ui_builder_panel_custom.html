{% load static %}

<aside class="control-sidebar control-sidebar-dark ui-customiser">
    <div class="p-3 control-sidebar-content">
        <h5>Customize</h5>
        <hr class="mb-2">
        <div class="mb-3">
            <label for="jazzmin-theme-chooser">Light Theme:</label>
            <select id="jazzmin-theme-chooser" class="form-control"></select>
        </div>
        <div class="mb-3">
            <label for="jazzmin-dark-mode-theme-chooser">Dark Theme:</label>
            <select id="jazzmin-dark-mode-theme-chooser" class="form-control"></select>
        </div>
        <button id="save-theme-btn" class="btn btn-primary btn-block" style="margin-bottom: 1em;">Save</button>
        <div class="mb-2">
            <label>Last Selected Theme:</label>
            <input type="text" class="form-control" value="{{ jazzmin_theme }}" readonly />
        </div>
        <script>
        // JS logic for theme picker can be added here if needed
        </script>
    </div>
</aside>
