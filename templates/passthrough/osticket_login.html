{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Remove padding from content area */
    #content-main {
        padding: 0 !important;
        margin: 0 !important;
    }

    /* Full viewport background */
    .osticket-wrapper {
        min-height: calc(100vh - 60px);
        background: url('{% static "osticket/images/login-bg-official.png" %}') no-repeat center center;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Blur overlay */
    .osticket-wrapper::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 0, 31, 0.6);
        backdrop-filter: blur(8px);
    }

    /* Login card */
    .osticket-login-box {
        position: relative;
        z-index: 10;
        width: 420px;
        max-width: 90%;
        background: white;
        border-radius: 8px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .osticket-logo {
        text-align: center;
        margin-bottom: 20px;
    }

    .osticket-logo img {
        max-width: 200px;
        height: auto;
    }

    .osticket-login-box h1 {
        text-align: center;
        color: #2c3e50;
        font-size: 24px;
        margin-bottom: 10px;
    }

    .osticket-login-box h3 {
        text-align: center;
        color: #7f8c8d;
        font-size: 16px;
        font-weight: normal;
        margin-bottom: 30px;
    }

    .osticket-login-box input[type="text"],
    .osticket-login-box input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .osticket-login-box button {
        width: 100%;
        padding: 12px;
        background: #5867dd;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .osticket-login-box button:hover {
        background: #4651bf;
    }

    .osticket-login-box .copyright {
        text-align: center;
        margin-top: 25px;
        color: #999;
        font-size: 12px;
    }
</style>
{% endblock %}

{% block content %}
<div class="osticket-wrapper">
    <div class="osticket-login-box">
        <div class="osticket-logo">
            <img src="{% static 'osticket/images/logo.png' %}" alt="OSTicket" onerror="this.style.display='none'">
        </div>

        <h1>{{ title }}</h1>
        <h3>Authentication Required</h3>

        <form method="post" action="{{ action_url }}">
            {% csrf_token %}
            <input type="text" name="userid" placeholder="Email or Username" required autofocus>
            <input type="password" name="passwd" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>

        <div class="copyright">Copyright © 2025 PolySaaS</div>
    </div>
</div>
{% endblock %}
