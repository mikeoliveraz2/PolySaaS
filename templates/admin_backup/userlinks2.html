{% comment %} Custom userlinks override for Jazzmin top navigation {% endcomment %}
<li id="gmail-bell-container" style="position:relative;">
  <a href="/dose/gmail-inbox/" title="Unread Gmail Messages">
    <i class="fas fa-bell" style="font-size:1.3em; color:#ffd700; position:relative;"></i>
    <span id="gmail-unread-badge" style="background:#dc3545; color:#fff; border-radius:50%; padding:2px 7px; font-size:0.9em; position:absolute; top:-10px; right:-18px; min-width:20px; text-align:center;">0</span>
  </a>
</li>
<script>
async function fetchUnreadCountJazzmin() {
  try {
    const resp = await fetch('/dose/gmail-api/gmail/v1/users/me/messages?labelIds=UNREAD&maxResults=1');
    const data = await resp.json();
    let count = 0;
    if (resp.ok && data.resultSizeEstimate !== undefined) {
      count = data.resultSizeEstimate;
    }
    document.getElementById('gmail-unread-badge').textContent = count;
  } catch (e) {
    document.getElementById('gmail-unread-badge').textContent = '?';
  }
}
fetchUnreadCountJazzmin();
setInterval(fetchUnreadCountJazzmin, 60000);
</script>
