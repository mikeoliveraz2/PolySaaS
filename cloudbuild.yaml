# Cloud Build CI/CD — PolySaaS Django core to Cloud Run
# Trigger: push to main (configure in GCP Console → Cloud Build → Triggers)
#
# Substitutions (set in trigger or command line):
#   _AR_HOST       — e.g. us-central1-docker.pkg.dev/PROJECT/polysaas
#   _IMAGE         — polysaas-django
#   _TAG           — $SHORT_SHA or latest
#   _REGION        — us-central1
#   _SERVICE       — polysaas-core
#   _CLOUDSQL      — project:region:instance

substitutions:
  _AR_HOST: us-central1-docker.pkg.dev/${PROJECT_ID}/polysaas
  _IMAGE: polysaas-django
  _TAG: latest
  _REGION: us-central1
  _SERVICE: polysaas-core
  _CLOUDSQL: ${PROJECT_ID}:us-central1:your-cloudsql-instance

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # --- Build Django image ---
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.gcp
      - -t
      - ${_AR_HOST}/${_IMAGE}:${_TAG}
      - -t
      - ${_AR_HOST}/${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_HOST}/${_IMAGE}
    waitFor: [build]

  # --- Run migrations against Cloud SQL (Cloud SQL Auth Proxy in build) ---
  - id: migrate
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - DOSE_DB_PASSWORD
      - DJANGO_SECRET_KEY
    env:
      - USE_CLOUD_SQL=true
      - CLOUDSQL_CONNECTION_NAME=${_CLOUDSQL}
      - DB_NAME=dosedbsaas
      - DB_USER=dosedbadmin
      - DB_HOST=/cloudsql/${_CLOUDSQL}
      - DJANGO_SETTINGS_MODULE=mysite.settings_gcp
    args:
      - -c
      - |
        set -e
        docker run -d --name cloudsql-proxy \
          -v /cloudsql:/cloudsql \
          gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2 \
          --unix-socket /cloudsql ${_CLOUDSQL}
        sleep 3
        docker run --rm \
          --network container:cloudsql-proxy \
          -e DOSE_DB_PASSWORD="$$DOSE_DB_PASSWORD" \
          -e DJANGO_SECRET_KEY="$$DJANGO_SECRET_KEY" \
          -e USE_CLOUD_SQL=true \
          -e CLOUDSQL_CONNECTION_NAME=${_CLOUDSQL} \
          -e DB_NAME=dosedbsaas \
          -e DB_USER=dosedbadmin \
          -e DB_HOST=/cloudsql/${_CLOUDSQL} \
          -e DJANGO_SETTINGS_MODULE=mysite.settings_gcp \
          ${_AR_HOST}/${_IMAGE}:${_TAG} \
          /app/gcp-predeploy.sh
        docker stop cloudsql-proxy || true
    waitFor: [push]

  # --- Deploy to Cloud Run ---
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_AR_HOST}/${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=polysaas-cloud-run@${PROJECT_ID}.iam.gserviceaccount.com
      - --add-cloudsql-instances=${_CLOUDSQL}
      - --set-env-vars=DJANGO_SETTINGS_MODULE=mysite.settings_gcp,USE_CLOUD_SQL=true,CLOUDSQL_CONNECTION_NAME=${_CLOUDSQL},DB_NAME=dosedbsaas,DB_USER=dosedbadmin,DB_HOST=/cloudsql/${_CLOUDSQL},RUN_MIGRATIONS=0
      - --set-secrets=DOSE_DB_PASSWORD=dose-db-password:latest,DJANGO_SECRET_KEY=django-secret-key:latest
      - --memory=2Gi
      - --cpu=2
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --port=8080
    waitFor: [migrate]

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/dose-db-password/versions/latest
      env: DOSE_DB_PASSWORD
    - versionName: projects/${PROJECT_ID}/secrets/django-secret-key/versions/latest
      env: DJANGO_SECRET_KEY

images:
  - ${_AR_HOST}/${_IMAGE}:${_TAG}
  - ${_AR_HOST}/${_IMAGE}:latest
