<div class="ps-home-ml-teaser">
  <style>
    .ps-home-ml-teaser {
      --ps-hml-navy: #001f3f;
      --ps-hml-accent: #2563eb;
      --ps-hml-muted: #64748b;
      --ps-hml-line: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    .ps-home-ml-teaser * { box-sizing: border-box; }

    .ps-home-ml-row {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--ps-hml-line);
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    /* Left: match ML page .ps-ml-hero-banner background + .ps-ml-hero-pattern */
    .ps-home-ml-visual {
      position: relative;
      overflow: hidden;
      flex: 1 1 260px;
      min-height: 240px;
      min-width: min(100%, 260px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.75rem;
      background-color: #030712;
      background-image:
        radial-gradient(ellipse 110% 85% at 100% -10%, rgba(59, 130, 246, 0.45), transparent 52%),
        radial-gradient(ellipse 70% 55% at -5% 110%, rgba(99, 102, 241, 0.2), transparent 48%),
        linear-gradient(158deg, #020617 0%, #0f2847 40%, #0c1929 100%);
      background-size: auto;
      background-position: top right, bottom left, center;
      background-repeat: no-repeat;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ps-home-ml-visual::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 2;
      background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.7), rgba(59, 130, 246, 0.4), transparent);
      opacity: 0.85;
      pointer-events: none;
    }
    .ps-home-ml-pattern {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.5;
      pointer-events: none;
    }
    .ps-home-ml-icon-wrap {
      position: relative;
      z-index: 1;
      width: 7.5rem;
      height: 7.5rem;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 20px 56px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 48px rgba(59, 130, 246, 0.15);
    }
    .ps-home-ml-icon-wrap svg {
      display: block;
      width: 7.5rem;
      height: 7.5rem;
      border-radius: 14px;
    }

    /* Right: text */
    .ps-home-ml-copy {
      flex: 1 1 320px;
      padding: 2rem 2rem 2.25rem;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .ps-home-ml-copy h2 {
      margin: 0 0 0.65rem;
      font-size: clamp(1.35rem, 2.8vw, 1.65rem);
      font-weight: 700;
      color: var(--ps-hml-navy);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .ps-home-ml-copy p {
      margin: 0 0 1.15rem;
      font-size: 1.02rem;
      line-height: 1.65;
      color: var(--ps-hml-muted);
    }
    .ps-home-ml-copy p strong { color: #0f172a; font-weight: 600; }

    .ps-home-ml-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      font-size: 1rem;
      color: var(--ps-hml-accent);
      text-decoration: none;
      margin-top: 0.15rem;
    }
    .ps-home-ml-cta:hover { text-decoration: underline; color: #1d4ed8; }
    .ps-home-ml-cta span { font-size: 1.15em; line-height: 1; }
