# Render Blueprint — PolySaaS (temporary phase before GCP)
# https://render.com/docs/blueprint-spec
#
# Blueprint-first (PolySaaS-Main): Define and update services here — avoid creating duplicate
# manual web services for the same app. If a service `name` matches an existing one, Render
# attaches/updates; mismatched names create duplicates. Prefer one Blueprint per workspace/repo.
#
# Apply: Dashboard → New → Blueprint → connect this repo (branch main; default path render.yaml).
# First-time: use workspace PolySaaS-Main. See documentation/RENDER_BLUEPRINT_SETUP.md for linking
# existing services (names + regions must match what you already deployed).
# Add secrets in the dashboard or via `sync: false` prompts on first sync.
#
# Who does what (clarity):
# - In this repo: edit YAML, commit, push. Web/worker services with autoDeployTrigger: commit pick up builds.
# - On Render (your turn): Blueprint Apply/Sync when you add or rename services; paste secrets for keys marked
#   sync: false (env groups or per-service); Postgres admin tasks (e.g. create odoouser / odoodb) before Odoo boots;
#   delete legacy *manual* duplicates (old worker/Odoo names) only after PolySaaS-Celery-Worker2 + PolySaaS-Odoo2 are healthy.
#
# Notes:
# - Django/Celery use Dockerfile.django (never the repo-root stub Dockerfile).
# - Odoo uses deploy/odoo-render/Dockerfile (official odoo:18 + PORT split; ODOO_DB_USER avoids POSIX USER=odoo collision).
# - preDeploy runs after image build, before new instances get traffic (web) / start (worker).
#   Pre-deploy: use `/app/render-predeploy.sh` (single argv). Bare `cmd && cmd` in YAML is parsed as extra Django args.
# - We call migrate_all_schemas explicitly (not `migrate`) to match multi-tenant manage.py.
# - Scale to more services later by copying a block and changing `name`, `type`, `dockerCommand`.
# - ML Studio uses deploy/ml-studio-render/Dockerfile (standalone UI + ML libs; grow requirements.txt over time).
# - Mattermost uses deploy/mattermost-render/Dockerfile + dedicated Postgres polysaas-mattermost-db (not the Django DB).

previews:
  generation: off

envVarGroups:
  - name: polysaas-common
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mysite.settings_render
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set in dashboard / Blueprint sync prompts (never commit real secrets)
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Optional tuning (set LOG_LEVEL=DEBUG on the service when deep-testing passthrough / PolySniffer)
      - key: LOG_LEVEL
        value: INFO
      - key: CC_LOG_LEVEL
        value: INFO
      - key: CELERY_LOG_LEVEL
        value: INFO
      - key: CELERY_CONCURRENCY
        value: "2"

  # Passthrough / integration targets (set URLs or secrets in Render when each app is wired).
  # Naming is intentionally generic; map to Django settings or TenantApp.extra_config as you implement each bundle.
  - name: polysaas-bundled-apps
    envVars:
      - key: NEXTCLOUD_BASE_URL
        sync: false
      - key: NEXTCLOUD_SERVICE_TOKEN
        sync: false
      # Django reads MATTERMOST_URL (mysite/settings.py). MATTERMOST_BASE_URL is reserved for other callers.
      - key: MATTERMOST_URL
        sync: false
      - key: MATTERMOST_BASE_URL
        sync: false
      - key: MATTERMOST_BOT_TOKEN
        sync: false
      - key: MATTERMOST_ADMIN_TOKEN
        sync: false
      - key: DOLIBARR_BASE_URL
        sync: false
      - key: DOLIBARR_API_KEY
        sync: false
      - key: LIFERAY_BASE_URL
        sync: false
      - key: LIFERAY_OAUTH_CLIENT_SECRET
        sync: false
      - key: WORDPRESS_BASE_URL
        sync: false
      - key: WORDPRESS_APPLICATION_PASSWORD
        sync: false
      - key: POLYSYSMON_BASE_URL
        sync: false
      - key: POLYSYSMON_API_KEY
        sync: false
      - key: MONITORLOGGER_BASE_URL
        sync: false
      - key: MONITORLOGGER_INGEST_KEY
        sync: false
      - key: AIASPEERS_BASE_URL
        sync: false
      - key: AIASPEERS_API_KEY
        sync: false
      - key: APPSASPEERS_BASE_URL
        sync: false
      - key: APPSASPEERS_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      # Public URL of PolySaaS-ML-Studio web service when wired (see deploy/ml-studio-render/README.txt).
      - key: MLSTUDIO_BASE_URL
        sync: false
      - key: MLSTUDIO_API_KEY
        sync: false

  # Odoo — used only by service `PolySaaS-Odoo2` (fromGroup). Canonical keys (set values in Render; never commit secrets):
  #   ODOO_DB_HOST, ODOO_DB_USER, ODOO_DB_PASSWORD, ODOO_DB_NAME, ODOO_DB_PORT — see deploy/odoo-render/README.txt
  # Defaults below match Option A (dedicated role + DB). Override ODOO_DB_USER in dashboard if you use the instance owner role.
  - name: polysaas-odoo
    envVars:
      - key: ODOO_DB_HOST
        sync: false
      - key: ODOO_DB_USER
        value: odoouser
      - key: ODOO_DB_PASSWORD
        sync: false
      - key: ODOO_DB_NAME
        value: odoodb
      - key: ODOO_DB_PORT
        value: "5432"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ODOO_MASTER_PASSWORD
        sync: false

  # WordPress (MariaDB in a private service)
  - name: polysaas-wordpress
    envVars:
      - key: WORDPRESS_DB_HOST
        value: PolySaaS-WordPress-DB
      - key: WORDPRESS_DB_NAME
        value: wordpress
      - key: WORDPRESS_DB_USER
        value: wp
      - key: WORDPRESS_DB_PASSWORD
        sync: false
      - key: WORDPRESS_TABLE_PREFIX
        value: wp_

  # Liferay (Postgres in a private service)
  - name: polysaas-liferay
    envVars:
      - key: LIFERAY_DB_HOST
        value: PolySaaS-Liferay-DB
      - key: LIFERAY_DB_PORT
        value: "5432"
      - key: LIFERAY_DB_NAME
        value: liferay
      - key: LIFERAY_DB_USER
        value: liferay
      - key: LIFERAY_DB_PASSWORD
        sync: false

# Dedicated Postgres for Mattermost only (do not point it at PolySaaS-Core’s application database).
databases:
  - name: polysaas-mattermost-db
    region: singapore
    plan: basic-256mb
    databaseName: mattermost
    user: mattermost

services:
  # --- Main Django / Gunicorn (uses Dockerfile CMD + ENTRYPOINT) ---
  # Name matches live service PolySaaS-Core so Blueprint sync attaches instead of duplicating.
  - type: web
    name: PolySaaS-Core
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: Dockerfile.django
    dockerContext: .
    # Omit dockerCommand → image CMD runs Gunicorn via /entrypoint.sh
    healthCheckPath: /health/
    autoDeployTrigger: commit
    preDeployCommand: /app/render-predeploy.sh
    envVars:
      - fromGroup: polysaas-common
      - fromGroup: polysaas-bundled-apps
      # First-time / disaster recovery: set to 1 on the web service only if you need migrate on boot too
      - key: RUN_MIGRATIONS
        value: "0"
      # Admin /admin/ index diagnostics (dose.admin_index_diag); set 0 when done debugging
      - key: ADMIN_INDEX_DIAG
        value: "1"

  # --- Adminer (PostgreSQL UI; deploy in same workspace + region as polysaas-postgres for internal host)
  #     Image listens on 8080 — after sync, confirm Dashboard → Settings → the service listens on port 8080.
  #     Set ADMINER_DEFAULT_SERVER to the internal hostname only (e.g. dpg-xxxx-a), not a postgresql:// URL.
  #     Secure the public URL (Render auth / IP allowlist / Adminer login plugins); see deploy/adminer-render/README.txt
  - type: web
    name: PolySaaS-Adminer
    runtime: image
    region: singapore
    plan: starter
    healthCheckPath: /
    image:
      url: docker.io/library/adminer:4.8.1
    envVars:
      - key: ADMINER_DEFAULT_SERVER
        sync: false

  # --- Celery worker — `PolySaaS-Celery-Worker2` (renamed on purpose: avoids Blueprint vs manual name fights).
  #     When this service is healthy, delete any legacy manual worker (`PolySaaS-Celery-Worker`, `PolySaaS-Celery-BP`).
  #     Same image + preDeploy as Core; secrets come from polysaas-common + polysaas-bundled-apps only (fromGroup).
  - type: worker
    name: PolySaaS-Celery-Worker2
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: Dockerfile.django
    dockerContext: .
    dockerCommand: celery -A mysite worker -l INFO --concurrency=2
    autoDeployTrigger: commit
    preDeployCommand: /app/render-predeploy.sh
    envVars:
      - fromGroup: polysaas-common
      - fromGroup: polysaas-bundled-apps
      - key: RUN_MIGRATIONS
        value: "0"

  # --- Odoo — `PolySaaS-Odoo2` (service name on Render). Disk `odoo2-filestore` is the persistent volume resource name;
  #     mountPath `/var/lib/odoo` is what the container sees. Env: group `polysaas-odoo` only (not Django common).
  #     When healthy, remove any leftover manual `PolySaaS-Odoo` so you do not run two Odoo stacks.
  - type: web
    name: PolySaaS-Odoo2
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: deploy/odoo-render/Dockerfile
    dockerContext: deploy/odoo-render
    autoDeployTrigger: commit
    healthCheckPath: /web/login
    envVars:
      - fromGroup: polysaas-odoo
    disk:
      name: odoo2-filestore
      mountPath: /var/lib/odoo
      sizeGB: 10

  # --- Peers Adapter (Mattermost outgoing webhook edge; phase 1 proxies to Django ai_peers_webhook) ---
  - type: web
    name: PolySaaS-Peers-Adapter
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: deploy/peers-adapter/Dockerfile
    dockerContext: deploy/peers-adapter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PEERS_UPSTREAM_DJANGO_URL
        sync: false
      - key: AI_PEERS_WEBHOOK_TOKEN
        sync: false

  # --- Machine Learning Studio (own image for UI + heavy ML deps; Django keeps tables / admin for now) ---
  - type: web
    name: PolySaaS-ML-Studio
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: deploy/ml-studio-render/Dockerfile
    dockerContext: deploy/ml-studio-render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: POLYSAAS_CORE_BASE_URL
        sync: false
      - key: MLSTUDIO_SERVICE_TOKEN
        sync: false

  # --- Mattermost (Team Edition tarball + Render Postgres + disk under /var/lib/mattermost) ---
  - type: web
    name: PolySaaS-Mattermost
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: deploy/mattermost-render/Dockerfile
    dockerContext: deploy/mattermost-render
    healthCheckPath: /api/v4/system/ping
    autoDeployTrigger: commit
    disk:
      name: mattermost-persist
      mountPath: /var/lib/mattermost
      sizeGB: 10
    envVars:
      - key: MM_SQLSETTINGS_DATASOURCE
        fromDatabase:
          name: polysaas-mattermost-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: polysaas-mattermost-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: polysaas-mattermost-db
          property: port
      - key: MM_SERVICESETTINGS_SITEURL
        sync: false

  # --- WordPress (Apache) + MariaDB (private service) ---
  - type: pserv
    name: PolySaaS-WordPress-DB
    runtime: image
    region: singapore
    plan: starter
    image:
      url: docker.io/library/mariadb:11.4
    disk:
      name: wordpress-db-persist
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MARIADB_RANDOM_ROOT_PASSWORD
        value: "1"
      - key: MARIADB_DATABASE
        value: wordpress
      - key: MARIADB_USER
        value: wp
      - key: MARIADB_PASSWORD
        sync: false

  - type: web
    name: PolySaaS-WordPress
    runtime: image
    region: singapore
    plan: starter
    healthCheckPath: /
    image:
      url: docker.io/library/wordpress:6.5-apache
    envVars:
      - fromGroup: polysaas-wordpress

  # --- Liferay + Postgres (private service) ---
  - type: pserv
    name: PolySaaS-Liferay-DB
    runtime: image
    region: singapore
    plan: starter
    image:
      url: docker.io/library/postgres:16
    disk:
      name: liferay-db-persist
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      - key: POSTGRES_DB
        value: liferay
      - key: POSTGRES_USER
        value: liferay
      - key: POSTGRES_PASSWORD
        sync: false

  - type: web
    name: PolySaaS-Liferay
    runtime: image
    region: singapore
    plan: starter
    healthCheckPath: /
    image:
      url: docker.io/liferay/portal:7.4.3.112-ga112
    envVars:
      - fromGroup: polysaas-liferay
      - key: LIFERAY_JDBC_DEFAULT_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: LIFERAY_JDBC_DEFAULT_URL
        value: jdbc:postgresql://PolySaaS-Liferay-DB:5432/liferay
      - key: LIFERAY_JDBC_DEFAULT_USERNAME
        value: liferay
      - key: LIFERAY_JDBC_DEFAULT_PASSWORD
        sync: false

