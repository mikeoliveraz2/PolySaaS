# PolySaaS Complete Stack for Railway
# All services (core infrastructure + bundled applications) in one compose file
# Usage: docker compose -f docker-compose.railway.yml up -d
# On Railway: Create a template with this file and set environment variables via Railway UI

version: '3.8'

services:
  # ════════════════════════════════════════════════════════════════════════════
  # CORE INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: ps-railway-pg
    environment:
      POSTGRES_USER: ${DOSE_DB_USER:-dosedbadmin}
      POSTGRES_PASSWORD: ${DOSE_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DOSE_DB:-dosedbsaas}
    volumes:
      - railway_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOSE_DB_USER:-dosedbadmin} -d ${DOSE_DB:-dosedbsaas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - polysaas-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ps-railway-rmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - railway_rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - polysaas-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ps-railway-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - railway_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - polysaas-network

  grafana:
    image: grafana/grafana:10.4.3
    container_name: ps-railway-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - railway_grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - polysaas-network

  monitorlogger:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: ps-railway-monitorlogger
    environment:
      ZO_ROOT_USER_EMAIL: ${MONITORLOGGER_ROOT_USER_EMAIL:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${MONITORLOGGER_ROOT_USER_PASSWORD:-changeme}
      ZO_LOCAL_MODE: "true"
    volumes:
      - railway_monitorlogger_data:/data
    restart: unless-stopped
    networks:
      - polysaas-network

  # ════════════════════════════════════════════════════════════════════════════
  # POLYSAAS CORE (DJANGO/DOSE)
  # ════════════════════════════════════════════════════════════════════════════

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: polysaas-django
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-mysite.settings}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-changeme}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${DOSE_DB_USER:-dosedbadmin}:${DOSE_DB_PASSWORD:-changeme}@postgres:5432/${DOSE_DB:-dosedbsaas}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polysaas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: polysaas-celery-worker
    command: celery -A mysite worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-mysite.settings}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-changeme}
      DATABASE_URL: postgresql://${DOSE_DB_USER:-dosedbadmin}:${DOSE_DB_PASSWORD:-changeme}@postgres:5432/${DOSE_DB:-dosedbsaas}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polysaas-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: polysaas-celery-beat
    command: celery -A mysite beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-mysite.settings}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-changeme}
      DATABASE_URL: postgresql://${DOSE_DB_USER:-dosedbadmin}:${DOSE_DB_PASSWORD:-changeme}@postgres:5432/${DOSE_DB:-dosedbsaas}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polysaas-network

  # ════════════════════════════════════════════════════════════════════════════
  # BUNDLED APPLICATIONS
  # ════════════════════════════════════════════════════════════════════════════

  # ──── Mattermost ────────────────────────────────────────────────────────────

  mattermost-db:
    image: postgres:15-alpine
    container_name: polysaas-mattermost-db
    environment:
      POSTGRES_USER: ${MATTERMOST_DB_USER:-mattermost}
      POSTGRES_PASSWORD: ${MATTERMOST_DB_PASSWORD:-mattermost}
      POSTGRES_DB: ${MATTERMOST_DB:-mattermost}
    volumes:
      - mattermost_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATTERMOST_DB_USER:-mattermost}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - polysaas-network

  mattermost:
    image: mattermost/mattermost-enterprise-edition:latest
    container_name: polysaas-mattermost
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${MATTERMOST_DB_USER:-mattermost}:${MATTERMOST_DB_PASSWORD:-mattermost}@mattermost-db:5432/${MATTERMOST_DB:-mattermost}?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL:-http://localhost:8065}
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_SERVICESETTINGS_ENABLETESTING: "true"
      MM_EXPERIMENTALSETTINGS_ENABLEOPENIDCONNECT: "true"
    ports:
      - "8065:8065"
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_config:/mattermost/config
      - mattermost_plugins:/mattermost/plugins
    depends_on:
      mattermost-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polysaas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──── Nextcloud ─────────────────────────────────────────────────────────────

  nextcloud-db:
    image: mariadb:10.11
    container_name: polysaas-nextcloud-db
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_MYSQL_ROOT_PASSWORD:-nextcloud_root_pw}
      MYSQL_DATABASE: ${NEXTCLOUD_DB:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_pw}
    volumes:
      - nextcloud_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - polysaas-network

  nextcloud:
    image: nextcloud:28
    container_name: polysaas-nextcloud
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: ${NEXTCLOUD_DB:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_pw}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1}
      OVERWRITEPROTOCOL: ${NEXTCLOUD_PROTOCOL:-http}
      OVERWRITEHOST: ${NEXTCLOUD_HOST:-localhost:8888}
      NC_OVERWRITECLIURL: ${NEXTCLOUD_CLI_URL:-http://localhost:8888}
    ports:
      - "8888:80"
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      nextcloud-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polysaas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──── Liferay ───────────────────────────────────────────────────────────────

  liferay-db:
    image: mysql:8.0
    container_name: polysaas-liferay-db
    environment:
      MYSQL_ROOT_PASSWORD: ${LIFERAY_MYSQL_ROOT_PASSWORD:-liferay_root}
      MYSQL_DATABASE: ${LIFERAY_DB:-lportal}
      MYSQL_USER: ${LIFERAY_DB_USER:-liferay}
      MYSQL_PASSWORD: ${LIFERAY_DB_PASSWORD:-liferay}
    volumes:
      - liferay_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - polysaas-network

  liferay:
    image: liferay/portal:7.4.3.120-ga120
    container_name: polysaas-liferay
    environment:
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: com.mysql.cj.jdbc.Driver
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: jdbc:mysql://liferay-db:3306/${LIFERAY_DB:-lportal}?characterEncoding=UTF-8&dontTrackOpenResources=true&holdResultsOpenOverStatementClose=true&serverTimezone=GMT&useFastDateParsing=false&useUnicode=true
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: ${LIFERAY_DB_USER:-liferay}
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: ${LIFERAY_DB_PASSWORD:-liferay}
    ports:
      - "8181:8080"
    volumes:
      - liferay_data:/opt/liferay/data
      - liferay_deploy:/opt/liferay/deploy
    depends_on:
      liferay-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polysaas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/web/guest/home"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──── Odoo ──────────────────────────────────────────────────────────────────

  odoo-db:
    image: postgres:15-alpine
    container_name: polysaas-odoo-db
    environment:
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
        POSTGRES_DB: ${ODOO_DB:-odoo}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - polysaas-network

  odoo:
    image: odoo:17
    container_name: polysaas-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      PORT: 5432
    ports:
      - "8086:8069"
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
    restart: unless-stopped
    networks:
      - polysaas-network

  # ════════════════════════════════════════════════════════════════════════════
  # OPTIONAL: Polysysmon (comment out if not needed)
  # Note: Requires docker/ subdirectory with Polysysmon source
  # ════════════════════════════════════════════════════════════════════════════

  # polysysmon-webui:
  #   build:
  #     context: ./docker/PolySysMon/RaptorWebUIQ
  #     dockerfile: Dockerfile
  #   container_name: polysysmon-webui
  #   ports:
  #     - "8070:8070"
  #     - "5000:5000"
  #   environment:
  #     - NODE_ENV=production
  #     - API_PORT=5000
  #     - WEB_PORT=8070
  #   restart: unless-stopped
  #   networks:
  #     - polysaas-network
  #   depends_on:
  #     - polysysmon-redis
  #     - polysysmon-postgres
  #
  # polysysmon-redis:
  #   image: redis:7-alpine
  #   container_name: polysysmon-redis
  #   restart: unless-stopped
  #   networks:
  #     - polysaas-network
  #
  # polysysmon-postgres:
  #   image: postgres:15-alpine
  #   container_name: polysysmon-postgres
  #   environment:
  #     POSTGRES_USER: polysysmon
  #     POSTGRES_PASSWORD: polysysmon
  #     POSTGRES_DB: polysysmon
  #   volumes:
  #     - polysysmon_pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - polysaas-network

volumes:
  # Core
  railway_pg_data:
  railway_rmq_data:
  railway_es_data:
  railway_grafana_data:
  railway_monitorlogger_data:
  # Mattermost
  mattermost_db_data:
  mattermost_data:
  mattermost_logs:
  mattermost_config:
  mattermost_plugins:
  # Nextcloud
  nextcloud_db:
  nextcloud_data:
  # Liferay
  liferay_db_data:
  liferay_data:
  liferay_deploy:
  # Odoo
  odoo_db_data:
  odoo_web_data:
  # Polysysmon (optional)
  # polysysmon_pg_data:

networks:
  polysaas-network:
    driver: bridge
