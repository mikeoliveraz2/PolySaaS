# Local / lab backing services for PolySaaS.
# PolySaaS core (Django/DOSE) runs via manage.py on host by default.
# Usage: docker compose -f docker-compose.local-stack.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ps-local-pg
    environment:
      POSTGRES_USER: dosedbadmin
      POSTGRES_PASSWORD: ${DOSE_DB_PASSWORD:-PolySaaS2026!}
      POSTGRES_DB: dosedbsaas
    ports:
      - "5433:5432"
    volumes:
      - localstack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosedbadmin -d dosedbsaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ps-local-rmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - localstack_rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ps-local-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  localstack_pg_data:
  localstack_rmq_data:
